<style>
/*FONTS-START*/
@font-face { font-family: "Fredoka"; font-weight: 500; font-style: normal; font-display: swap; src: url("fonts/fredoka-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Fredoka"; font-weight: 600; font-style: normal; font-display: swap; src: url("fonts/fredoka-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Fredoka"; font-weight: 700; font-style: normal; font-display: swap; src: url("fonts/fredoka-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/figtree-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 500; font-style: normal; font-display: swap; src: url("fonts/figtree-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 600; font-style: normal; font-display: swap; src: url("fonts/figtree-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 700; font-style: normal; font-display: swap; src: url("fonts/figtree-latin-700-normal.woff2") format("woff2"); }
html { color-scheme: light; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/*FONTS-END*/

/* Layout: a box of jars (the month's total) on top, free-standing jars below, expenses in a drawer behind a paper-clip tab, a floating Add button, and bottom sheets for input. */
:root {
  --bg: #EEF3F1;
  --surface: #FFFFFF;
  --ink: #14221D;
  --muted: #5B6C66;
  --line: #D8E2DE;
  --accent: #2F5BEA;
  --accent-ink: #FFFFFF;
  --danger: #D33A41;
  --good: #1D8A57;
  --scrim: rgba(12, 22, 18, .42);
  --shadow: 0 1px 2px rgba(20, 34, 29, .06), 0 6px 20px rgba(20, 34, 29, .06);

  --j0: #2FA36B; --j1: #F08A2B; --j2: #E4508A; --j3: #3A86F0;
  --j4: #8B5CF6; --j5: #D6A400; --j6: #13A0A0; --j7: #E5484D;

  --font-display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
}
/* "Auto" theme: follow the system, or the claude.ai viewer's own light/dark switch. */
@media (prefers-color-scheme: dark) {
  :root:not([data-skin]):not([data-theme="light"]) {
    --bg: #0E1412; --surface: #17201C; --ink: #E8F0EC; --muted: #93A49D; --line: #2A3631;
    --accent: #7F9BFF; --accent-ink: #0E1412; --danger: #FF6B70; --good: #4CC38A;
    --scrim: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-skin]) {
  --bg: #0E1412; --surface: #17201C; --ink: #E8F0EC; --muted: #93A49D; --line: #2A3631;
  --accent: #7F9BFF; --accent-ink: #0E1412; --danger: #FF6B70; --good: #4CC38A;
  --scrim: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
:root[data-skin="midnight"] {
  --bg: #000000; --surface: #121214; --ink: #F4F4F5; --muted: #9B9BA4; --line: #26262B;
  --accent: #A78BFA; --accent-ink: #0B0B0D; --danger: #FF6B70; --good: #4ADE80;
  --scrim: rgba(0, 0, 0, .72); --shadow: 0 0 0 1px #1E1E22;
  --j0: #34D399; --j1: #FB923C; --j2: #F472B6; --j3: #60A5FA;
  --j4: #A78BFA; --j5: #FACC15; --j6: #2DD4BF; --j7: #F87171;
  color-scheme: dark;
}
:root[data-skin="sunny"] {
  --bg: #FFFFFF; --surface: #FFFFFF; --ink: #1B1530; --muted: #6B6585; --line: #EEEAF6;
  --accent: #FF4F8B; --accent-ink: #FFFFFF; --danger: #E5383B; --good: #16A34A;
  --scrim: rgba(27, 21, 48, .35); --shadow: 0 2px 4px rgba(255, 79, 139, .06), 0 10px 28px rgba(80, 60, 160, .10);
  --j0: #22C55E; --j1: #FF8A00; --j2: #FF3D7F; --j3: #2D9CFF;
  --j4: #9B5CFF; --j5: #FFC400; --j6: #00C2B8; --j7: #FF4D4D;
  color-scheme: light;
}
:root[data-skin="holiday"] {
  --bg: #0F2A1F; --surface: #163A2B; --ink: #FFF7E8; --muted: #BFD3C5; --line: #24513C;
  --accent: #E23B4E; --accent-ink: #FFFFFF; --danger: #FF7A85; --good: #7EE2A8;
  --scrim: rgba(5, 15, 10, .6); --shadow: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.25);
  --j0: #5FD39A; --j1: #F2C14E; --j2: #FF8FA3; --j3: #8FD3FF;
  --j4: #B48CFF; --j5: #E9E4D4; --j6: #FF9F6B; --j7: #E23B4E;
  color-scheme: dark;
}
:root[data-skin="diwali"] {
  --bg: #1B1036; --surface: #2A1A4F; --ink: #FFF4DE; --muted: #CDBDE6; --line: #3D2A6B;
  --accent: #FF9F1C; --accent-ink: #1B1036; --danger: #FF6B81; --good: #7EE2A8;
  --scrim: rgba(10, 5, 25, .65); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
  --j0: #FFB627; --j1: #FF6F59; --j2: #F15BB5; --j3: #00BBF9;
  --j4: #B794F6; --j5: #FFD166; --j6: #2EC4B6; --j7: #EF476F;
  color-scheme: dark;
}
:root[data-skin="thanksgiving"] {
  --bg: #FFF6EC; --surface: #FFFFFF; --ink: #3B2414; --muted: #8A6A55; --line: #F0DCC8;
  --accent: #C8551F; --accent-ink: #FFFFFF; --danger: #C62828; --good: #2E7D32;
  --scrim: rgba(59, 36, 20, .4); --shadow: 0 2px 4px rgba(140, 90, 43, .08), 0 10px 28px rgba(140, 90, 43, .12);
  --j0: #D9822B; --j1: #B5452B; --j2: #E0A526; --j3: #7A8B3A;
  --j4: #8C5A2B; --j5: #C9A227; --j6: #4F7C6B; --j7: #A0303A;
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  position: relative; z-index: 1;
  max-width: 1040px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 120px;
  display: flex; flex-direction: column; gap: 22px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, .jar:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-size: 1.5rem; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 32px; height: 32px; border-radius: 9px; display: block; }
:root[data-skin="holiday"] .brand::after { content: "🎄"; font-size: 1.2rem; }
:root[data-skin="diwali"] .brand::after { content: "🪔"; font-size: 1.2rem; }
:root[data-skin="thanksgiving"] .brand::after { content: "🦃"; font-size: 1.2rem; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.month { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.month button { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 999px; font-size: 1.1rem; }
.month button:hover:not(:disabled) { background: var(--bg); }
.month button:disabled { opacity: .3; cursor: default; }
.month-label { min-width: 130px; text-align: center; font-weight: 600; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); width: 46px; height: 46px; border-radius: 999px; font-size: 1.25rem; display: grid; place-items: center; }

/* Summary: a box of new mason jars seen from the top, one lid per jar, with a taped-on label. */
.summary { display: grid; gap: 10px; }
.eyebrow { font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.big { font-family: var(--font-display); font-size: clamp(2.2rem, 7vw, 3.2rem); font-weight: 600; line-height: 1.05; }
.jarbox {
  --box: #C9965B; --box-wall: #B8864E; --box-flap: #D3A469; --box-inside: #5E3F22; --box-print: #8A5F33;
  position: relative; width: 100%; max-width: 440px; margin: 0 auto;
}
:root[data-skin="holiday"] .jarbox { --box: #B3202F; --box-wall: #8E1B2A; --box-flap: #C42A3A; --box-inside: #4A0E18; --box-print: #F2C14E; }
.jarbox svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 10px 14px rgba(0,0,0,.16)); overflow: visible; }
.jarbox .b-flap { fill: var(--box-flap); }
.jarbox .b-crease { stroke: var(--box-wall); stroke-width: 1.5; }
.jarbox .b-wall { fill: var(--box-wall); }
.jarbox .b-inside { fill: var(--box-inside); }
.jarbox .b-ribbon { fill: #F2C14E; display: none; }
:root[data-skin="diwali"] .jarbox { --box: #6A2C91; --box-wall: #4E1F6E; --box-flap: #7B3AA6; --box-inside: #2B0F40; --box-print: #FFD166; }
:root[data-skin="holiday"] .jarbox .b-ribbon, :root[data-skin="diwali"] .jarbox .b-ribbon { display: inline; }
.jarbox .b-print { fill: var(--box-print); font-family: var(--font-display); font-weight: 700; }
.lid-g { cursor: pointer; }
.lid-g .l-glass { fill: rgba(255, 255, 255, .28); stroke: rgba(255, 255, 255, .5); stroke-width: 1; }
.lid-g .l-rim { fill: color-mix(in srgb, var(--c) 62%, #000); }
.lid-g .l-top { fill: var(--c); }
.lid-g .l-ring { fill: none; stroke: rgba(255, 255, 255, .35); stroke-width: 1.2; }
.lid-g .l-name { fill: #FFFFFF; font-family: var(--font-display); font-weight: 700; text-anchor: middle; paint-order: stroke; stroke: rgba(0, 0, 0, .28); stroke-width: 2px; }
.lid-g.over .l-rim { fill: var(--danger); }
.box-sticker {
  position: relative; margin: -34px auto 0; width: fit-content; min-width: 190px; max-width: 86%;
  background: #FFF8EC; color: #2A1E12; border-radius: 10px; padding: 8px 18px 10px; text-align: center;
  transform: rotate(-2deg); box-shadow: 0 6px 14px rgba(0,0,0,.18);
}
.box-sticker::before { content: ""; position: absolute; top: -9px; left: 50%; width: 64px; height: 18px; transform: translateX(-50%) rotate(3deg); background: rgba(255,255,255,.6); border: 1px solid rgba(0,0,0,.06); }
.summary .box-sticker .eyebrow { color: #7A6650; font-size: .66rem; }
.box-sticker .big { color: #2A1E12; font-size: clamp(1.5rem, 7vw, 2.2rem); }
.box-sticker.over .big, .summary .box-sticker.over .eyebrow { color: #D33A41; }
.sum-line { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; color: var(--muted); font-size: .92rem; }
.sum-line b { color: var(--ink); }
.stack { max-width: 440px; width: 100%; margin: 0 auto; height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; display: flex; }
.stack i { display: block; height: 100%; }
.pace { color: var(--muted); font-size: .9rem; text-align: center; }

/* Jars */
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-head h2 { font-size: 1.25rem; }
.hint { color: var(--muted); font-size: .8rem; font-weight: 500; }
.link-btn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 6px 2px; }
.jars { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 14px; }
.jar {
  --c: var(--j0);
  position: relative; border: 0; background: none; padding: 0;
  display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  transition: transform .15s ease, opacity .15s ease;
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
}
.jar:hover { transform: translateY(-3px); }
.jar:active { transform: scale(.97); }
.jar:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 18px; }
.jar.drag-src { opacity: .25; }
.drag-ghost { position: fixed; z-index: 90; pointer-events: none; transform: translate(-50%, -55%) scale(1.06) rotate(-3deg); filter: drop-shadow(0 16px 20px rgba(0,0,0,.28)); }
.jar-art { position: relative; width: 100%; max-width: 168px; }
.jar-art svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 6px 10px rgba(0,0,0,.10)); }
.jar-art .glass { fill: color-mix(in srgb, var(--c) 8%, var(--surface)); }
.jar-art .glass-edge { fill: none; stroke: color-mix(in srgb, var(--c) 45%, var(--line)); stroke-width: 2.5; }
.jar.over .jar-art .glass-edge { stroke: var(--danger); stroke-width: 3; }
.jar-art .lid { fill: color-mix(in srgb, var(--c) 55%, var(--ink)); }
.jar-art .neck { fill: color-mix(in srgb, var(--c) 30%, var(--surface)); }
.jar-art .shine { fill: #FFFFFF; opacity: .45; }
.jar-art .liquid { transition: transform 1.2s cubic-bezier(.25, .9, .3, 1.15); }
.jar-art .wave { fill: var(--c); }
.jar-art .wave.back { opacity: .45; animation: slosh 5.5s linear infinite reverse; }
.jar-art .wave.front { opacity: .9; animation: slosh 3.2s linear infinite; }
@keyframes slosh { to { transform: translateX(50px); } }
.jar-art .jar-emoji { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); font-size: 2.1rem; line-height: 1; filter: drop-shadow(0 1px 1px rgba(0,0,0,.2)); }
.jar-label {
  position: absolute; left: 50%; top: 72%; transform: translate(-50%, -50%);
  background: color-mix(in srgb, var(--surface) 92%, transparent); color: var(--ink);
  border-radius: 10px; padding: 3px 10px 4px; box-shadow: 0 1px 3px rgba(0,0,0,.15);
  font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; line-height: 1.1; white-space: nowrap;
  max-width: 66%; overflow: hidden; text-overflow: ellipsis;
}
.jar-label small { display: block; font-family: var(--font-body); font-weight: 600; font-size: .62rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.jar.over .jar-label { color: var(--danger); }
.jar-name { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jar-sub { color: var(--muted); font-size: .82rem; margin-top: -4px; }
.pill { position: absolute; top: 4px; right: 6px; z-index: 1; font-size: .66rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 7px; border-radius: 999px; background: var(--bg); color: var(--muted); }
.pill.warn { background: color-mix(in srgb, var(--j5) 30%, var(--surface)); color: var(--ink); }
.pill.bad { background: var(--danger); color: var(--surface); }
.jar.add { justify-content: center; color: var(--muted); font-weight: 600; border: 2px dashed var(--line); border-radius: 22px; min-height: 200px; }
.jar.add span:first-child { font-size: 2rem; line-height: 1; }

/* Rows (expenses) */
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row-emoji { width: 38px; height: 38px; flex: none; border-radius: 12px; display: grid; place-items: center; font-size: 1.25rem; background: color-mix(in srgb, var(--c, var(--j0)) 20%, transparent); }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-meta { color: var(--muted); font-size: .84rem; }
.row-amt { font-weight: 700; }
.row-del { border: 0; background: none; color: var(--muted); width: 34px; height: 34px; border-radius: 10px; font-size: 1.1rem; flex: none; }
.row-del:hover { background: var(--bg); color: var(--danger); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.notice { font-size: .85rem; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; }
.foot { text-align: center; color: var(--muted); font-size: .82rem; margin: 0; }
.foot a { color: inherit; }

/* FAB */
.fab {
  position: fixed; z-index: 20;
  right: max(20px, calc(env(safe-area-inset-right, 0px) + 20px));
  bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 16px));
  border: 0; border-radius: 999px; padding: 16px 24px 16px 20px;
  background: var(--accent); color: var(--accent-ink);
  font-family: var(--font-display); font-weight: 600; font-size: 1.1rem;
  box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 45%, transparent);
  display: flex; align-items: center; gap: 8px;
}
.fab b { font-size: 1.5rem; line-height: 1; font-weight: 500; }
/* Leave room on narrow screens for the paper-clip tab on the right edge. */
@media (max-width: 640px) { .wrap { padding-right: max(44px, env(safe-area-inset-right, 0px)); } }

/* Expenses drawer, opened by a paper-clipped tab on the right edge. */
.clip-tab {
  position: fixed; z-index: 25; right: 0; top: 46%;
  border: 1px solid var(--line); border-right: 0; background: var(--surface); color: var(--ink);
  border-radius: 14px 0 0 14px; padding: 18px 8px 12px 9px;
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  box-shadow: -4px 4px 14px rgba(0,0,0,.14);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.clip-tab svg { position: absolute; top: -18px; left: 50%; width: 18px; height: 40px; transform: translateX(-50%) rotate(8deg); }
.clip-tab span { writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--font-display); font-weight: 600; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
.clip-tab b { font-size: .7rem; min-width: 20px; padding: 1px 5px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
.drawer-scrim { position: fixed; inset: 0; z-index: 44; background: var(--scrim); }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 45; width: min(420px, 92vw);
  background: var(--surface); color: var(--ink); box-shadow: -20px 0 50px rgba(0,0,0,.25);
  transform: translateX(105%); transition: transform .28s cubic-bezier(.3,.8,.3,1), visibility 0s .28s;
  display: flex; flex-direction: column; visibility: hidden;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.drawer.open { transform: none; visibility: visible; transition: transform .28s cubic-bezier(.3,.8,.3,1), visibility 0s; }
.drawer-head { padding: 18px 18px 12px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.drawer-head .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.drawer-head .chip { flex: none; padding: 6px 12px; font-size: .88rem; }
.drawer-list { overflow: auto; flex: 1; }
.day-head { position: sticky; top: 0; background: var(--surface); padding: 10px 16px 4px; font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }

/* Sheets */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 20px; }
.sheet {
  background: var(--surface); color: var(--ink); width: 100%; max-width: 480px; max-height: 88vh; overflow: auto;
  border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

    const ms = state.spends.filter((s) => (s.date || "").slice(0, 7) === ym && ids.has(s.bucketId));
    const by = {};
    ms.forEach((s) => { by[s.bucketId] = (by[s.bucketId] || 0) + (Number(s.amount) || 0); });
    const limit = buckets.reduce((a, b) => a + (Number(b.limit) || 0), 0);
    const spent = ms.reduce((a, s) => a + (Number(s.amount) || 0), 0);
    return { ym, buckets, ms, by, limit, spent, left: limit - spent };
  }
  // Past months that have any spends, oldest first.
  const pastMonths = () => [...new Set(state.spends.map((s) => (s.date || "").slice(0, 7)).filter((m) => m && m < curMonth()))].sort();

  function earnedStickers() {
    const n = state.spends.length, got = new Set();
    if (state.buckets.length) got.add("first-jar");
    if (n >= 1) got.add("first-spend");
    if (n >= 10) got.add("ten");
    if (n >= 50) got.add("fifty");
    if (n >= 100) got.add("hundred");
    if (state.buckets.length >= 5) got.add("shelf");
    const months = pastMonths(), stats = months.map(monthStats);
    const past = stats.filter((m) => m.limit > 0);
    if (past.some((m) => m.left >= 0)) got.add("under");
    if (past.some((m) => m.left >= m.limit * 0.2)) got.add("saver");
    if (state.buckets.some((b) => {
      const lim = Number(b.limit) || 0; if (!(lim > 0)) return false;
      let run = 0;
      for (let i = 0; i < months.length; i++) {
        const back2back = i > 0 && shiftMonth(months[i - 1], 1) === months[i];
        const ok = (stats[i].by[b.id] || 0) <= lim;
        run = ok ? (back2back ? run + 1 : 1) : 0;
        if (run >= 3) return true;
      }
      return false;
    })) got.add("hero");
    const r = rhythm();
    if (r >= 4) got.add("rhythm4");
    if (r >= 8) got.add("rhythm8");
    if (r >= 12) got.add("rhythm12");
    if (state.recurring.length) got.add("repeat");
    if (lsGet("lj-used-math")) got.add("math");
    if (lsGet("lj-backup-at")) got.add("backup");
    if (lsGet("lj-wrap-opened")) got.add("wrap");
    try { if (JSON.parse(lsGet("lj-themes-tried") || "[]").length >= 3) got.add("explorer"); } catch {}
    return got;
  }
  // Stickers stay earned once earned (a streak can end, the sticker stays). New ones get a toast,
  // except the very first time we look, so existing users aren't flooded.
  function stickerShelf() {
    let saved = null;
    try { saved = JSON.parse(lsGet("lj-stickers") || "null"); } catch {}
    const first = !saved; saved = saved || {};
    const fresh = [...earnedStickers()].filter((id) => !saved[id]);
    fresh.forEach((id) => (saved[id] = todayStr()));
    if (fresh.length) { lsSet("lj-stickers", JSON.stringify(saved)); mirrorSoon(); }
    return { saved, fresh: first ? [] : fresh };
  }
  function checkStickers() {
    if (!state.loaded.buckets || !state.loaded.spends || !state.loaded.recurring) return;
    const { fresh } = stickerShelf();
    if (!fresh.length) return;
    const st = STICKERS.find((x) => x[0] === fresh[0]);
    setTimeout(() => toastLater(`${st[1]} New sticker: ${st[2]}!${fresh.length > 1 ? ` (+${fresh.length - 1} more)` : ""}`, 3600), 1600);
    happyMoment();
  }

  // Monthly repeats that are due: their day has come this month and they haven't been added or skipped.
  function dueRepeats() {
    const m = curMonth(), today = new Date().getDate(), dim = daysIn(m);
    return state.recurring.filter((r) => (r.lastMonth || "") < m && today >= Math.min(Number(r.day) || 1, dim) && state.buckets.some((b) => b.id === r.bucketId));
  }

  /* ---------- jar drawing ---------- */
  const JAR_BODY = "M16 36 Q16 28 26 28 H74 Q84 28 84 36 V114 Q84 128 70 128 H30 Q16 128 16 114 Z";
  const WAVE = "M-100 0 Q-87.5 -5 -75 0 T-50 0 T-25 0 T0 0 T25 0 T50 0 T75 0 T100 0 T125 0 T150 0 T175 0 T200 0 V140 H-100 Z";
  const lastLevel = {};
  const levelY = (f) => (f <= 0 ? 136 : 126 - 94 * Math.min(1, f)).toFixed(1);
  // Contents are drawn with their surface at y=0, filling downward; the group is shifted to the jar's level.
  function contents(type, key) {
    if (type === "liquid") return `<path class="wave back" d="${WAVE}" transform="translate(-12 2)"/><path class="wave front" d="${WAVE}"/>`;
    const r = rng(hash(key + type)); let s = "";
    const f = (n) => n.toFixed(1);
    if (type === "candy") {
      const cols = ["#FF5A7A", "#FFC93C", "#4CC3FF", "#7BE07B", "#B98CFF", "#FF9F45"];
      for (let row = 0; row < 11; row++) for (let x = 14 + (row % 2) * 6; x < 92; x += 12) {
        const cx = x + (r() - .5) * 3, cy = 5 + row * 9.5 + (row === 0 ? -r() * 3 : (r() - .5) * 2), rad = 4.6 + r() * .9;
        s += `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(rad)}" fill="${cols[Math.floor(r() * cols.length)]}"/><circle cx="${f(cx - 1.5)}" cy="${f(cy - 1.6)}" r="1.3" fill="#FFF" opacity=".7"/>`;
      }
    } else if (type === "kisses") {
      for (let row = 0; row < 11; row++) for (let x = 14 + (row % 2) * 6; x < 92; x += 12) {
        const cx = x + (r() - .5) * 3, cy = 6 + row * 10 + (row === 0 ? -r() * 3 : 0), rot = (r() - .5) * 30, foil = r() < .65;
        s += `<g transform="translate(${f(cx)} ${f(cy)}) rotate(${f(rot)})"><path d="M0 -7 C.8 -4.5 5.5 -1 5.5 2.5 C5.5 5.5 3 7 0 7 C-3 7 -5.5 5.5 -5.5 2.5 C-5.5 -1 -.8 -4.5 0 -7Z" fill="${foil ? "#C9CFD8" : "#6B3F1F"}" stroke="${foil ? "#8E97A3" : "#4A2A12"}" stroke-width=".6"/><path d="M-2 0 Q-1 -3 0 -5" stroke="#FFF" stroke-width=".9" fill="none" opacity=".7"/><path d="M0 -7 q2 -3 4.5 -3.5" stroke="#F4F6FA" stroke-width="1.1" fill="none"/></g>`;
      }
    } else if (type === "cash") {
      // Each bill shows your currency's symbol; longer symbols (like CA$) get smaller.
      const sym = esc(currency.symbol), sz = Math.min(5, 9 / Math.max(1, [...currency.symbol].length));
      for (let row = 0; row < 16; row++) for (let k = 0; k < 3; k++) {
        const cx = 18 + k * 30 + (r() - .5) * 16, cy = 4 + row * 7 + (row === 0 ? -r() * 3 : 0), rot = (r() - .5) * 50;
        s += `<g transform="translate(${f(cx)} ${f(cy)}) rotate(${f(rot)})"><rect x="-14" y="-6.5" width="28" height="13" rx="1.5" fill="#5DBB75" stroke="#2F7D46" stroke-width=".8"/><rect x="-11" y="-4" width="22" height="8" rx="1" fill="none" stroke="#2F7D46" stroke-width=".5" opacity=".6"/><circle r="3.2" fill="#E8F5E9"/><text y="${f(1 + sz * .36)}" text-anchor="middle" font-size="${f(sz)}" font-weight="700" fill="#2F7D46">${sym}</text></g>`;
      }
    } else if (type === "coins") {
      for (let row = 0; row < 22; row++) for (let x = 16 + (row % 2) * 7; x < 92; x += 14) {
        const cx = x + (r() - .5) * 4, cy = 3 + row * 5 + (row === 0 ? -r() * 2 : 0);
        s += `<ellipse cx="${f(cx)}" cy="${f(cy + 1.6)}" rx="7.6" ry="3.4" fill="#B9851A"/><ellipse cx="${f(cx)}" cy="${f(cy)}" rx="7.6" ry="3.4" fill="#F5C542"/><ellipse cx="${f(cx)}" cy="${f(cy)}" rx="5" ry="2.1" fill="none" stroke="#E0A526" stroke-width=".8"/>`;
      }
    }
    return s;
  }
  function jarArt(key, frac, emoji, type) {
    const clip = "jc-" + String(key).replace(/[^A-Za-z0-9_-]/g, "");
    const lk = key + ":" + type;
    const from = lastLevel[lk] ?? 0;
    lastLevel[lk] = frac;
    return `<svg viewBox="0 0 100 132" aria-hidden="true">
        <defs><clipPath id="${clip}"><path d="${JAR_BODY}"/></clipPath></defs>
        <path class="glass" d="${JAR_BODY}"/>
        <g clip-path="url(#${clip})">
          <g class="liquid" style="transform:translateY(${levelY(from)}px)" data-to="${levelY(frac)}">${contents(type, key)}</g>
        </g>
        <path class="glass-edge" d="${JAR_BODY}"/>
        <rect class="shine" x="24" y="42" width="7" height="46" rx="3.5"/>
        <rect class="neck" x="27" y="20" width="46" height="10" rx="3"/>
        <rect class="lid" x="22" y="6" width="56" height="17" rx="6"/>
      </svg>
      ${emoji ? `<span class="jar-emoji" aria-hidden="true">${esc(emoji)}</span>` : ""}`;
  }
  function pourJars() {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.querySelectorAll(".liquid[data-to]").forEach((g) => { g.style.transform = `translateY(${g.dataset.to}px)`; g.removeAttribute("data-to"); });
    }));
  }

  /* ---------- the box of jars, seen from the top ---------- */
  function boxView(buckets, by) {
    const n = buckets.length;
    const cols = n <= 4 ? Math.max(n, 1) : n <= 8 ? Math.ceil(n / 2) : Math.ceil(n / 3);
    const rows = Math.max(1, Math.ceil(n / cols));
    const IW = 240, cell = Math.min(IW / cols, 78), IH = rows * cell + 8;
    const ix = 40, iy = 46, W = 320, H = iy + IH + 8 + 40;
    const wl = ix - 8, wr = ix + IW + 8, wt = iy - 8, wb = iy + IH + 8;
    let lids = "";
    buckets.forEach((b, i) => {
      const row = Math.floor(i / cols), col = i % cols, inRow = Math.min(cols, n - row * cols);
      const cx = ix + IW / 2 + (col - (inRow - 1) / 2) * (IW / cols), cy = iy + 4 + cell * (row + .5);
      const rad = cell * .4, lim = Number(b.limit) || 0, over = lim - (by[b.id] || 0) < 0;
      const fs = Math.max(7, Math.min(13, rad * .36, (rad * 1.75) / (b.name.length * .58))), maxCh = Math.max(3, Math.floor((rad * 1.75) / (fs * .58)));
      const name = b.name.length > maxCh ? b.name.slice(0, maxCh - 1).trimEnd() + "…" : b.name;
      lids += `<g class="lid-g ${over ? "over" : ""}" style="--c:${bucketColor(b)}" data-open="${esc(b.id)}" role="button" aria-label="${esc(b.name)}">
        <circle class="l-glass" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(rad * 1.13).toFixed(1)}"/>
        <circle class="l-rim" cx="${cx.toFixed(1)}" cy="${(cy + 2).toFixed(1)}" r="${rad.toFixed(1)}"/>
        <circle class="l-top" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(rad * .9).toFixed(1)}"/>
        <circle class="l-ring" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(rad * .74).toFixed(1)}"/>
        <text x="${cx.toFixed(1)}" y="${(cy - rad * .12).toFixed(1)}" font-size="${(fs * 1.35).toFixed(1)}" text-anchor="middle">${esc(b.emoji || "🫙")}</text>
        <text class="l-name" x="${cx.toFixed(1)}" y="${(cy + rad * .5).toFixed(1)}" font-size="${fs.toFixed(1)}">${esc(name)}</text>
      </g>`;
    });
    if (!n) lids = `<text class="b-print" x="${ix + IW / 2}" y="${iy + IH / 2 + 5}" font-size="13" text-anchor="middle" style="fill:#EBD3B0">Your jars go here</text>`;
    return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">
        <polygon class="b-flap" points="${wl},${wt} ${wr},${wt} ${wr - 18},${wt - 34} ${wl + 18},${wt - 34}"/>
        <polygon class="b-flap" points="${wl},${wb} ${wr},${wb} ${wr - 18},${wb + 34} ${wl + 18},${wb + 34}"/>
        <polygon class="b-flap" points="${wl},${wt} ${wl},${wb} ${wl - 30},${wb - 14} ${wl - 30},${wt + 14}"/>
        <polygon class="b-flap" points="${wr},${wt} ${wr},${wb} ${wr + 30},${wb - 14} ${wr + 30},${wt + 14}"/>
        <rect class="b-ribbon" x="${W / 2 - 9}" y="${wt - 34}" width="18" height="34"/><rect class="b-ribbon" x="${W / 2 - 9}" y="${wb}" width="18" height="34"/>
        <rect class="b-ribbon" x="${wl - 30}" y="${(wt + wb) / 2 - 9}" width="30" height="18"/><rect class="b-ribbon" x="${wr}" y="${(wt + wb) / 2 - 9}" width="30" height="18"/>
        <text class="b-print" x="${wl - 15}" y="${wt + 34}" font-size="12" text-anchor="middle">↑</text>
        <text class="b-print" x="${wr + 15}" y="${wt + 34}" font-size="12" text-anchor="middle">↑</text>
        <rect class="b-wall" x="${wl}" y="${wt}" width="${wr - wl}" height="${wb - wt}" rx="3"/>
        <rect class="b-inside" x="${ix}" y="${iy}" width="${IW}" height="${IH}" rx="2"/>
        ${lids}
      </svg>`;
  }

  /* ---------- render ---------- */
  function render() {
    $("monthLabel").textContent = monthName(state.month);
    $("nextMonth").disabled = state.month >= curMonth();
    const { ms, by } = totals();
    const buckets = sortedBuckets();
    const loading = !state.loaded.buckets || !state.loaded.spends;

    const limit = buckets.reduce((a, b) => a + (Number(b.limit) || 0), 0);
    const spent = buckets.reduce((a, b) => a + (by[b.id] || 0), 0);
    const left = limit - spent;
    let pace = "";
    if (state.month === curMonth() && limit > 0) {
      const dLeft = daysIn(state.month) - new Date().getDate() + 1;
      pace = left > 0 ? `${dLeft} day${dLeft === 1 ? "" : "s"} left in ${monthName(state.month).split(" ")[0]} · about ${money(left / dLeft)} a day to stay on track` : `${dLeft} day${dLeft === 1 ? "" : "s"} left and you're over budget`;
    } else if (state.month < curMonth() && limit > 0) {
      pace = left >= 0 ? `Finished ${money(left)} under budget` : `Finished ${money(-left)} over budget`;
    }
    const segs = limit > 0 ? buckets.map((b) => { const w = Math.min(by[b.id] || 0, b.limit) / Math.max(limit, spent) * 100; return w > 0 ? `<i style="width:${w}%;background:${bucketColor(b)}" title="${esc(b.name)}"></i>` : ""; }).join("") : "";
    $("summary").innerHTML = loading ? `<div class="eyebrow" style="text-align:center">Loading your budget…</div>` : `
      <div class="jarbox">${boxView(buckets, by)}</div>
      <div class="box-sticker ${left < 0 ? "over" : ""}">
        <div class="eyebrow">${left >= 0 ? "Left in all jars" : "Over budget by"}</div>
        <div class="big num">${money(Math.abs(left))}</div>
      </div>
      <div class="sum-line num"><span><b>${money(spent)}</b> spent</span><span><b>${money(limit)}</b> budgeted</span><span><b>${buckets.length}</b> jar${buckets.length === 1 ? "" : "s"}</span></div>
      <div class="stack" role="img" aria-label="${money(spent)} of ${money(limit)} spent">${segs}</div>
      ${pace ? `<div class="pace">${pace}</div>` : ""}
      ${badgesLine()}`;

    $("jars").innerHTML = loading ? "" : buckets.map((b) => {
      const sp = by[b.id] || 0, lim = Number(b.limit) || 0, lf = lim - sp;
      const frac = lim > 0 ? Math.max(0, Math.min(1, lf / lim)) : 0;
      const used = lim > 0 ? sp / lim : 0;
      const pill = lf < 0 ? `<span class="pill bad">Over</span>` : used >= 0.85 ? `<span class="pill warn">Almost out</span>` : "";
      return `<button class="jar ${lf < 0 ? "over" : ""}" style="--c:${bucketColor(b)}" data-open="${esc(b.id)}" data-id="${esc(b.id)}" aria-label="${esc(b.name)}: ${lf < 0 ? money(-lf) + " over" : money(lf) + " left"} of ${money(lim)}">
        ${pill}
        <div class="jar-art">
          ${jarArt(b.id, frac, b.emoji || "🫙", fillOf(b))}
          <div class="jar-label num"><small>${lf < 0 ? "over" : "left"}</small>${lf < 0 ? "−" + money(-lf) : money(lf)}</div>
        </div>
        <div class="jar-name">${esc(b.name)}</div>
        <div class="jar-sub num">of ${money(lim)}</div>
      </button>`;
    }).join("") + (loading || state.readOnly ? "" : `<button class="jar add" data-new-bucket><span>+</span><span>${buckets.length ? "New jar" : "Make your first jar"}</span></button>`);
    pourJars();
    $("dragHint").textContent = buckets.length > 1 && !state.readOnly ? "· hold to move" : "";
    $("clipCount").hidden = !ms.length; $("clipCount").textContent = ms.length;

    $("fab").hidden = state.readOnly;
    $("newBucketTop").hidden = state.readOnly;
    if (drawer.open) renderDrawer();

  function badgesLine() {

  /* ---------- confirm dialog ---------- */
  let confirmResolve = null;

  /* ---------- sheets ---------- */

  function renderSheet(anim) {
    if (!sheet) return;
    let html = "";
    if (sheet.kind === "spend") {
      const buckets = sortedBuckets();
      const v = evalAmount(sheet.amount || "");

  document.addEventListener("submit", async (e) => {

  function openAddSpend(bucketId) {
    if (!state.buckets.length) return openBucket();
    openSheet({ kind: "spend", bucketId: bucketId || (state.buckets.length === 1 ? state.buckets[0].id : ""), date: state.month === curMonth() ? todayStr() : `${state.month}-01` });
  }
  function openBucket(id) {
    const b = id && state.buckets.find((x) => x.id === id);
    const used = new Set(state.buckets.map((x) => x.color));
    let free = 0; while (used.has(free) && free < COLORS - 1) free++;
    openSheet({ kind: "bucket", id: id || null, draft: b ? { name: b.name, limit: String(b.limit), emoji: b.emoji, color: b.color ?? 0, fill: b.fill || "surprise" } : { name: "", limit: "", emoji: "🛒", color: free, fill: "surprise" } });
  }

  function openEditSpend(id) {

    openSheet(next);

  /* ---------- jar heads-up: a friendly warning when a spend pushes a jar past 85% or over ---------- */
  function jarUse(bucketId, exceptId) {
    const m = curMonth();
    return state.spends.filter((s) => s.bucketId === bucketId && s.id !== exceptId && (s.date || "").slice(0, 7) === m).reduce((a, s) => a + (Number(s.amount) || 0), 0);
  }
  function headsUp(b, before, amt, date) {
    const lim = Number(b.limit) || 0, after = before + amt;
    if (!(lim > 0) || before >= lim || date.slice(0, 7) !== curMonth()) return;
    const dLeft = daysIn(curMonth()) - new Date().getDate();
    const togo = dLeft > 0 ? `${dLeft} day${dLeft === 1 ? "" : "s"} to go` : "last day of the month";
    let msg = "";
    if (after > lim) msg = `${b.emoji || "🫙"} ${b.name} is over by ${money(after - lim)}. It happens! Maybe borrow from another jar?`;
    else if (after >= lim * 0.85 && before < lim * 0.85) msg = `⚠️ Heads-up: ${b.emoji || "🫙"} ${b.name} is ${Math.round(after / lim * 100)}% used, ${togo}`;
    if (msg) setTimeout(() => toast(msg, 4500), 1200);
  }

  /* ---------- prompts: reminder offer → Jar Wrap → due repeats, one at a time ---------- */
  let dueDismissed = false;
  function wrapDue() {
    const prev = shiftMonth(curMonth(), -1);
    if (new Date().getDate() > 10 || lsGet("lj-wrap-seen") === prev) return null;
    return monthStats(prev).ms.length >= 3 ? prev : null;
  }
  function nextPrompt(from) {
    setTimeout(() => {
      if (sheet || tourActive || !state.loaded.buckets || !state.loaded.spends) return;
      if (RM() && !lsGet("lj-reminder-asked") && from !== "remindAsk" && from !== "resume") return openSheet({ kind: "remindAsk" });
      const wm = wrapDue(); if (wm) return openWrap(wm, true);
      if (!state.readOnly && !dueDismissed && state.loaded.recurring && dueRepeats().length) return openSheet({ kind: "due" });
    }, 350);
  }
  async function answerDue(id, add) {
    const m = curMonth(), dim = daysIn(m);
    const list = id === "all" ? dueRepeats().filter((r) => !(sheet.done || []).includes(r.id)) : state.recurring.filter((r) => r.id === id);
    sheet.done = [...(sheet.done || []), ...list.map((r) => r.id)];
    let added = 0;
    for (const r of list) {
      const ok = await write(async () => {
        if (add) await store.add("spends", { bucketId: r.bucketId, amount: Number(r.amount) || 0, note: r.note || "", date: `${m}-${pad(Math.min(Number(r.day) || 1, dim))}`, createdAt: Date.now(), repeat: r.id });
        await store.update("recurring", r.id, { lastMonth: m });
      });
      if (ok && add) added += Number(r.amount) || 0;
    }
    if (add && added) { chaChing(); toast(`Added ${money(added)} 🔁`); }
    else if (!add) toast("Skipped for this month");
    if (dueRepeats().some((r) => !sheet.done.includes(r.id))) renderSheet();
    else closeSheet();
  }

  /* ---------- Jar Wrap: a recap of a finished month ---------- */
  function openWrap(month, auto) {
    if (auto) lsSet("lj-wrap-seen", month);
    lsSet("lj-wrap-opened", "1");
    openSheet({ kind: "wrap", month, confetti: true });
    checkStickers();
  }
  function wrapData(m) {
    const st = monthStats(m), jars = st.buckets.filter((b) => (Number(b.limit) || 0) > 0);
    const top = [...st.buckets].sort((a, b) => (st.by[b.id] || 0) - (st.by[a.id] || 0))[0];
    const leftFrac = (b) => 1 - (st.by[b.id] || 0) / b.limit;
    const hero = [...jars].sort((a, b) => leftFrac(b) - leftFrac(a))[0];
    const heroPct = hero ? Math.max(0, Math.round((1 - (st.by[hero.id] || 0) / hero.limit) * 100)) : 0;
    const under = jars.filter((b) => (st.by[b.id] || 0) <= b.limit).length;
    const pct = st.limit > 0 ? Math.round(Math.abs(st.left) / st.limit * 100) : 0;
    return {
      ...st, monthShort: monthName(m).split(" ")[0], count: st.ms.length, days: new Set(st.ms.map((s) => s.date)).size,
      top: top && st.by[top.id] ? top : null, topSpent: top ? st.by[top.id] || 0 : 0,
      hero: hero && heroPct > 0 ? hero : null, heroPct, under, jarCount: jars.length, pct,
      biggest: [...st.ms].sort((a, b) => (Number(b.amount) || 0) - (Number(a.amount) || 0))[0],
      headline: st.limit > 0 ? (st.left >= 0 ? `You kept ${pct}% of your budget in the jars! 🎉` : `A spendy month: ${pct}% over. Fresh jars now 💪`) : "Here's how your month went ✨",
      cheer: jars.length && under === jars.length ? "Every single jar. Legendary! 🏆" : under * 2 >= jars.length ? "More than half. Nice work! ✨" : "New month, fresh start 🌱",
    };
  }
  const confettiBits = () => Array.from({ length: 28 }, (_, i) => `<i style="left:${(Math.random() * 100).toFixed(1)}%;background:var(--j${i % 8});--drift:${(Math.random() * 80 - 40).toFixed(0)}px;animation-delay:${(Math.random() * .5).toFixed(2)}s"></i>`).join("");
  // The shareable picture: percentages and counts only, never amounts.
  async function wrapImage(m) {
    const w = wrapData(m), cs = getComputedStyle(document.documentElement), v = (n) => cs.getPropertyValue(n).trim();
    const c = document.createElement("canvas"); c.width = 1080; c.height = 1350;
    const x = c.getContext("2d");
    const g = x.createLinearGradient(0, 0, 1080, 1350); g.addColorStop(0, v("--accent")); g.addColorStop(1, v("--j4"));
    x.fillStyle = g; x.fillRect(0, 0, 1080, 1350);
    x.fillStyle = v("--surface"); x.beginPath(); x.roundRect(70, 230, 940, 960, 48); x.fill();
    const disp = v("--font-display"), body = v("--font-body");
    const text = (t, y, size, color, font = disp, weight = 600) => {
      let s = size; x.font = `${weight} ${s}px ${font}`;
      while (x.measureText(t).width > 860 && s > 20) { s -= 2; x.font = `${weight} ${s}px ${font}`; }
      x.fillStyle = color; x.textAlign = "center"; x.fillText(t, 540, y);
    };
    text(`🎁 My ${w.monthShort} Jar Wrap`, 150, 72, "#FFFFFF");
    text(w.limit > 0 ? (w.left >= 0 ? `Kept ${w.pct}% of my budget` : `Went ${w.pct}% over budget`) : "A month of jars", 360, 76, w.left >= 0 ? v("--ink") : v("--danger"));
    const lines = [
      [`${w.count} spends logged on ${w.days} days`, "✍️"],
      w.top ? [`Busiest jar: ${w.top.emoji || "🫙"} ${w.top.name}`, ""] : null,
      w.hero ? [`Jar hero: ${w.hero.emoji || "🫙"} ${w.hero.name} (${w.heroPct}% left)`, ""] : null,
      w.jarCount ? [`${w.under} of ${w.jarCount} jars stayed under their limit`, "🎯"] : null,
      rhythm() >= 2 ? [`${rhythm()}-week logging rhythm`, "🎵"] : null,
    ].filter(Boolean);
    lines.forEach(([t, e], i) => text(`${e ? e + " " : ""}${t}`, 500 + i * 120, 46, v("--ink"), body, 600));
    text(w.cheer, 1120, 40, v("--muted"), body, 600);
    const icon = document.querySelector(".brand-mark");
    try { if (icon && icon.complete) x.drawImage(icon, 340, 1230, 64, 64); } catch {}
    x.font = `600 44px ${disp}`; x.fillStyle = "#FFFFFF"; x.textAlign = "left"; x.fillText("Little Jars", 424, 1278);
    return c;
  }
  async function shareWrap(m) {
    try {
      const c = await wrapImage(m), name = `little-jars-wrap-${m}.png`, text = "My month in Little Jars 🫙";
      if (JT()) { await JT().shareImage({ base64: c.toDataURL("image/png").split(",")[1], filename: name, text }); return; }
      const blob = await new Promise((r) => c.toBlob(r, "image/png"));
      const file = new File([blob], name, { type: "image/png" });
      if (!IN_CLAUDE && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], text }); } catch (e) { if (e && e.name !== "AbortError") throw e; }
        return;
      }
      if (await saveFile(name, "image/png", blob)) toast("Picture saved 🎁");
    } catch { toast("Couldn't make the picture. Try again?"); }
  }

  /* ---------- your data: backup, restore, CSV ---------- */
  // Saves a file: Android asks where (Downloads, Drive…), the iPhone share sheet offers "Save to Files",
  // claude.ai hands it to your browser, and other browsers download it.
  async function saveFile(name, mime, data) {
    try {
      if (JT()) {
        const isBlob = data instanceof Blob;
        const payload = isBlob ? await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(",")[1]); fr.readAsDataURL(data); }) : data;
        const r = await JT().saveFile({ filename: name, mime, data: payload, base64: isBlob });
        return !!(r && r.saved);
      }
      if (IN_CLAUDE) {
        const dl = await window.claude.use("downloads");
        if (!dl) { toast("Saving files isn't available on this page."); return false; }
        try { await dl.save({ filename: name, data }); return true; }
        catch (e) { if (e && e.code === "declined") return false; throw e; }
      }
      const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
      const file = new File([blob], name, { type: mime });
      if (window.matchMedia("(pointer: coarse)").matches && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); return true; } catch (e) { return false; }
      }
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      return true;
    } catch { toast("Couldn't save the file."); return false; }
  }
  async function backup() {
    const data = JSON.stringify({ app: "little-jars", kind: "backup", format: 1, appVersion: APP_VERSION, exportedAt: new Date().toISOString(), currency: currency.code, buckets: state.buckets, spends: state.spends, recurring: state.recurring });
    if (await saveFile(`little-jars-backup-${todayStr()}.json`, "application/json", data)) {
      lsSet("lj-backup-at", String(Date.now())); mirrorSoon();
      toast("Backup saved 💾");
      checkStickers();
      if (sheet && sheet.kind === "settings") renderSheet();
    }
  }
  async function pickRestore() {
    if (JT()) {
      try { const r = await JT().openFile({ mime: "*/*" }); if (r && r.data) restoreFrom(r.data); } catch { toast("Couldn't open that file."); }
      return;
    }
    $("restoreFile").click();
  }
  const okId = (s) => typeof s === "string" && /^[A-Za-z0-9_-]{1,64}$/.test(s);
  const isDay = (s) => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
  const num = (n, max = MAX_AMOUNT) => { n = Number(n); return isFinite(n) ? Math.min(Math.max(n, 0), max) : 0; };
  const str = (s, n) => String(s ?? "").slice(0, n);
  async function restoreFrom(text) {
    let b;
    try { b = JSON.parse(text); } catch {}
    if (!b || b.app !== "little-jars" || !Array.isArray(b.buckets) || !Array.isArray(b.spends)) return toast("That doesn't look like a Little Jars backup.");
    const buckets = b.buckets.filter((x) => x && okId(x.id) && x.name).map((x) => [x.id, { name: str(x.name, 40), limit: num(x.limit), emoji: str(x.emoji || "🫙", 8), color: num(x.color, 99) | 0, order: num(x.order, 1e6), fill: str(x.fill || "surprise", 12), createdAt: num(x.createdAt, 1e14) }]);
    const ids = new Set(buckets.map(([id]) => id));
    const spends = b.spends.filter((x) => x && okId(x.id) && ids.has(x.bucketId) && isDay(x.date)).map((x) => [x.id, { bucketId: x.bucketId, amount: num(x.amount), note: str(x.note, 80), date: x.date, createdAt: num(x.createdAt, 1e14), ...(okId(x.repeat) ? { repeat: x.repeat } : {}) }]);
    const recurring = (Array.isArray(b.recurring) ? b.recurring : []).filter((x) => x && okId(x.id) && ids.has(x.bucketId)).map((x) => [x.id, { bucketId: x.bucketId, amount: num(x.amount), note: str(x.note, 80), day: Math.min(31, Math.max(1, num(x.day, 31) | 0)), lastMonth: str(x.lastMonth, 7), createdAt: num(x.createdAt, 1e14) }]);
    const when = b.exportedAt ? new Date(b.exportedAt).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "an earlier day";
    const ok = await ask({ title: "Restore this backup?", text: `From ${esc(when)}: <b>${buckets.length} jar${buckets.length === 1 ? "" : "s"}</b> and <b>${spends.length} spend${spends.length === 1 ? "" : "s"}</b>. This replaces the ${state.buckets.length} jars and ${state.spends.length} spends here.`, yes: "Restore", no: "Cancel" });
    if (!ok) return;
    if (sheet) closeSheet();
    toast("Restoring…");
    const old = { recurring: [...state.recurring], spends: [...state.spends], buckets: [...state.buckets] };
    const done = await write(async () => {
      for (const col of ["recurring", "spends", "buckets"]) for (const x of old[col]) await store.remove(col, x.id);
      for (const [id, v] of buckets) await store.put("buckets", id, v);
      for (const [id, v] of spends) await store.put("spends", id, v);
      for (const [id, v] of recurring) await store.put("recurring", id, v);
    });
    if (!done) return;
    if (b.currency && CURRENCIES.some((c) => c[0] === b.currency)) { setCurrencyCode(b.currency); prefs.currency = currency.code; savePrefs(); }
    state.month = curMonth(); render();
    toast(`Restored ${buckets.length} jars and ${spends.length} spends 🎉`);
  }
  async function exportCsv() {
    const bmap = Object.fromEntries(state.buckets.map((b) => [b.id, b]));
    const q = (v) => { const s = String(v ?? ""); return /[",\n\r]/.test(s) || /^[=+\-@]/.test(s) ? `"${s.replace(/^([=+\-@])/, "'$1").replace(/"/g, '""')}"` : s; };
    const rows = [...state.spends].sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.createdAt || 0) - (b.createdAt || 0))
      .map((s) => [s.date, bmap[s.bucketId] ? bmap[s.bucketId].name : "Deleted jar", s.note || "", (Number(s.amount) || 0).toFixed(currency.digits), currency.code].map(q).join(","));
    const csv = "﻿" + ["Date,Jar,Note,Amount,Currency", ...rows].join("\r\n");
    if (await saveFile(`little-jars-spends-${todayStr()}.csv`, "text/csv", csv)) toast(`Exported ${rows.length} spend${rows.length === 1 ? "" : "s"} 📊`);
  }

  /* ---------- rate us: asked once in a while, at a happy moment, only in the Android app ---------- */
  function happyMoment() {
    if (!JT() || lsGet("lj-rate") === "done") return;
    const first = Number(lsGet("lj-first-use")) || Date.now(), last = Number(lsGet("lj-rate-asked")) || 0, times = Number(lsGet("lj-rate-times")) || 0;
    const day = 864e5;
    if (Date.now() - first < 7 * day || state.spends.length < 10 || Date.now() - last < 60 * day || times >= 3) return;
    setTimeout(() => {
      if (sheet || tourActive || drawer.open) return;
      lsSet("lj-rate-asked", String(Date.now())); lsSet("lj-rate-times", String(times + 1));
      openSheet({ kind: "rate" });
    }, 2600);
  }

  /* ---------- reordering jars: long-press and drag, or the Earlier/Later buttons ---------- */
  async function saveOrder(ids) {
    const changed = ids.map((id, i) => [id, i + 1]).filter(([id, o]) => (state.buckets.find((b) => b.id === id) || {}).order !== o);
    if (!changed.length) return;
    await write(async () => { for (const [id, o] of changed) await store.update("buckets", id, { order: o }); });
  }
  async function moveBucket(id, delta) {
    const ids = sortedBuckets().map((b) => b.id), i = ids.indexOf(id), j = i + delta;
    if (i < 0 || j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    await saveOrder(ids);
  }
  let drag = null;
  function pressStart(x, y, target) {
    if (state.readOnly || drag) return;
    const jar = target.closest && target.closest(".jar[data-id]"); if (!jar) return;
    drag = { jar, x0: x, y0: y, x, y, active: false, timer: setTimeout(() => activateDrag(), 420) };
  }
  function activateDrag() {
    if (!drag) return;
    drag.active = true;
    try { navigator.vibrate && navigator.vibrate(15); } catch {}
    const g = drag.jar.cloneNode(true); g.classList.add("drag-ghost"); g.style.width = drag.jar.offsetWidth + "px";
    g.style.left = drag.x + "px"; g.style.top = drag.y + "px"; document.body.appendChild(g); drag.ghost = g;
    drag.jar.classList.add("drag-src");
  }
  function pressMove(x, y, ev) {
    if (!drag) return;
    drag.x = x; drag.y = y;
    if (!drag.active) { if (Math.hypot(x - drag.x0, y - drag.y0) > 10) cancelDrag(); return; }
    if (ev && ev.cancelable) ev.preventDefault();
    drag.ghost.style.left = x + "px"; drag.ghost.style.top = y + "px";
    const over = document.elementFromPoint(x, y), tj = over && over.closest(".jar[data-id]");
    if (tj && tj !== drag.jar) {
      const grid = $("jars"), kids = [...grid.children];
      grid.insertBefore(drag.jar, kids.indexOf(tj) > kids.indexOf(drag.jar) ? tj.nextSibling : tj);
    }
    if (y < 70) window.scrollBy(0, -12); else if (y > innerHeight - 70) window.scrollBy(0, 12);
  }
  function cancelDrag() { if (!drag) return; clearTimeout(drag.timer); drag.ghost && drag.ghost.remove(); drag.jar.classList.remove("drag-src"); drag = null; }
  async function pressEnd() {
    if (!drag) return;
    const was = drag.active;
    clearTimeout(drag.timer);
    if (was) {
      suppressClickUntil = Date.now() + 400;
      drag.ghost.remove(); drag.jar.classList.remove("drag-src");
      const ids = [...$("jars").querySelectorAll(".jar[data-id]")].map((el) => el.dataset.id);
      drag = null;
      await saveOrder(ids);
      render();
    } else drag = null;
  }
  const jarsEl = $("jars");
  jarsEl.addEventListener("touchstart", (e) => { const t = e.touches[0]; pressStart(t.clientX, t.clientY, e.target); }, { passive: true });
  document.addEventListener("touchmove", (e) => { if (drag) { const t = e.touches[0]; pressMove(t.clientX, t.clientY, e); } }, { passive: false });
  document.addEventListener("touchend", pressEnd); document.addEventListener("touchcancel", () => { if (drag && !drag.active) cancelDrag(); else pressEnd(); });
  jarsEl.addEventListener("mousedown", (e) => { if (e.button === 0) pressStart(e.clientX, e.clientY, e.target); });
  document.addEventListener("mousemove", (e) => { if (drag) pressMove(e.clientX, e.clientY, e); });
  document.addEventListener("mouseup", pressEnd);
  jarsEl.addEventListener("contextmenu", (e) => { if (e.target.closest(".jar")) e.preventDefault(); });

  /* ---------- toasts ---------- */
  let toastTimer;
  const toastQueue = [];
  function toast(msg, ms = 2600) {
    const el = $("toast"); el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; if (toastQueue.length) setTimeout(() => { if (el.hidden && toastQueue.length) toast(...toastQueue.shift()); }, 300); }, ms);
  }
  // Waits for the current toast to finish (so a sticker never hides a jar heads-up).
  function toastLater(msg, ms) {
    toastQueue.push([msg, ms]);
    if ($("toast").hidden) toast(...toastQueue.shift());
  }

  /* ---------- first-run tour ---------- */
  let tourStep = 0, tourSteps = [], tourActive = false;
  function startTour() {
    tourSteps = [
      { sel: ".jarbox", title: "Your box of jars 📦", text: "Every jar you make sits in this box. The label shows what's left this month across all of them." },
      state.buckets.length
        ? { sel: ".jar[data-id]", title: "Your jars 🫙", text: "Each jar has a monthly limit and drains as you spend. Tap one for details. Hold and drag to move it." }
        : { sel: ".jar.add", title: "Make your first jar 🫙", text: "Start here: create a jar like Groceries and give it a monthly limit." },
      { sel: "#fab", title: "Log a spend ✍️", text: "Tap here whenever you spend. Tip: type 12+10 and we'll add it up for you." },
      { sel: "#clipTab", title: "Your expenses 📎", text: "Tug the paper clip to see everything you've spent this month." },
      { sel: "#settingsBtn", title: "Make it yours ⚙️", text: "Themes, currency, sounds, reminders and feature requests live here." },
    ];
    tourStep = 0; tourActive = true; lsSet("lj-tour-done", "1"); lsSet("lj-seen-version", APP_VERSION);
    showTourStep();
  }
  function showTourStep() {
    const step = tourSteps[tourStep];
    if (!step) return endTour();
    const el = document.querySelector(step.sel);
    if (!el || el.hidden) { tourStep++; return showTourStep(); }
    if (getComputedStyle(el).position !== "fixed") el.scrollIntoView({ block: "center" });
    requestAnimationFrame(() => setTimeout(() => {
      if (!tourActive) return;
      const r = el.getBoundingClientRect(), p = 8;
      const below = innerHeight - r.bottom > 230 || r.top < 230;
      const bw = Math.min(320, innerWidth - 32), cx = r.left + r.width / 2;
      const left = Math.max(16, Math.min(innerWidth - bw - 16, cx - bw / 2));
      const last = tourStep === tourSteps.length - 1;
      $("tourRoot").innerHTML = `<div class="tour" role="dialog" aria-modal="true" aria-label="Quick tour">
        <div class="tour-spot" style="left:${r.left - p}px;top:${r.top - p}px;width:${r.width + p * 2}px;height:${r.height + p * 2}px"></div>
        <div class="tour-arrow ${below ? "up" : "down"}" style="left:${cx}px;top:${below ? r.bottom + p + 6 : r.top - p - 50}px"><svg viewBox="0 0 24 24" width="44" height="44"><path d="M12 22 L3 11 H9 V2 H15 V11 H21 Z" fill="currentColor" stroke="#7A5A00" stroke-width="1"/></svg></div>
        <div class="tour-bubble" style="left:${left}px;${below ? `top:${r.bottom + p + 58}px` : `bottom:${innerHeight - r.top + p + 58}px`}">
          <b>${step.title}</b><p>${step.text}</p>
          <div class="actions"><span class="tour-step">${tourStep + 1} of ${tourSteps.length}</span>${last ? "" : `<button class="btn" data-tour="skip">Skip</button>`}<button class="btn primary" data-tour="next" style="flex:none">${last ? "Got it!" : "Next"}</button></div>
        </div></div>`;
      const nb = document.querySelector('[data-tour="next"]'); if (nb) nb.focus();
    }, 260));
  }
  function endTour() { tourActive = false; $("tourRoot").innerHTML = ""; window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); nextPrompt("tour"); }
  $("tourRoot").addEventListener("click", (e) => {
    const b = e.target.closest("[data-tour]"); if (!b) return;
    if (b.dataset.tour === "skip") return endTour();
    tourStep++; showTourStep();
  });
  window.addEventListener("resize", () => { if (tourActive) showTourStep(); });

  /* ---------- onboarding flow: intro → tour (new) or what's new (update) → reminder offer, wrap, repeats ---------- */
  async function runOnboarding() {
    await dataReady;
    if (sheet || tourActive) return;
    const isNew = !lsGet("lj-tour-done") && !state.buckets.length && !state.spends.length;
    if (isNew) return startTour();
    if (lsGet("lj-seen-version") !== APP_VERSION) { lsSet("lj-seen-version", APP_VERSION); lsSet("lj-tour-done", "1"); return openSheet({ kind: "whatsnew" }); }
    nextPrompt("start");
  }
  function playIntro() {
    const el = $("intro");
    return new Promise((resolve) => {
      let done = false;
      const finish = () => { if (done) return; done = true; el.classList.add("out"); setTimeout(() => { el.remove(); resolve(); }, 350); };
      el.addEventListener("click", finish);
      setTimeout(finish, reduceMotion ? 500 : 1900);
    });
  }

  /* ---------- boot ---------- */
  async function boot() {
    const restored = await restoreMirror();
    loadLocalPrefs();
    if (!lsGet("lj-first-use")) lsSet("lj-first-use", String(Date.now()));
    applySkin();
    if ("serviceWorker" in navigator && location.protocol === "https:" && !IS_NATIVE && document.querySelector('link[rel="manifest"]')) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
    if (!IS_NATIVE && !document.querySelector('link[rel="manifest"]')) { const f = $("foot"); if (f) f.hidden = true; }
    render();
    const introDone = playIntro();
    let db = null;
    if (IN_CLAUDE) { try { db = await window.claude.use("db"); } catch {} }
    if (db) store = dbStore(db);
    else {
      store = localStore();
      if (IN_CLAUDE) { const n = $("notice"); n.hidden = false; n.textContent = "Saving on this device only. Open this page signed in to claude.ai to keep your budget synced."; }
    }
    if (IN_CLAUDE && db) {
      try { const user = await window.claude.use("user"); if (user && user.can && (await user.can("data.write")) === false) state.readOnly = true; } catch {}
    }
    const markLoaded = () => { if (state.loaded.buckets && state.loaded.spends) dataReadyResolve(); };
    store.subscribe("buckets", (docs) => { state.buckets = docs; state.loaded.buckets = true; render(); markLoaded(); dataChanged(); });
    store.subscribe("spends", (docs) => { state.spends = docs; state.loaded.spends = true; render(); markLoaded(); dataChanged(); });
    store.subscribe("recurring", (docs) => { state.recurring = docs; state.loaded.recurring = true; dataChanged(); if (sheet && ["recurring", "settings"].includes(sheet.kind)) renderSheet(); });
    if (store.watchPrefs) store.watchPrefs((p) => {
      if (p.theme && p.theme !== currentTheme()) { setTheme(p.theme); lsSet("budget-jars-theme", p.theme); }
      if (p.currency && p.currency !== currency.code) { setCurrencyCode(p.currency); prefs.currency = currency.code; lsSet("budget-jars-currency", currency.code); }
      if (typeof p.sound === "boolean") { prefs.sound = p.sound; lsSet("lj-sound", p.sound ? "on" : "off"); }
      if (typeof p.festive === "boolean" && p.festive !== prefs.festive) { prefs.festive = p.festive; lsSet("lj-festive", p.festive ? "on" : "off"); applySkin(); }
      render(); if (sheet && sheet.kind === "settings") renderSheet();
    });
    await introDone;
    if (restored) toast("Welcome back! Your jars came along to this phone 📲", 4000);
    await runOnboarding();
    dataReady.then(() => syncReminder());
    handleReminderTap();
  }
  boot();
})();
</script>
</body>
</html>
