/*FONTS-START*/

@font-face { font-family: "Figtree"; font-weight: 600; font-style: normal; font-display: swap; src: url("fonts/figtree-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 700; font-style: normal; font-display: swap; src: url("fonts/figtree-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Kalam"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/kalam-latin-400-normal.woff2") format("woff2"); }

html { color-scheme: light; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/*FONTS-END*/

/* Layout: a box of jars (the month's total) on top, free-standing jars below, expenses in a drawer behind a paper-clip tab, a floating Add button, and bottom sheets for input. */
:root {
  --bg: #EEF3F1;
  --surface: #FFFFFF;
  --ink: #14221D;
  --muted: #5B6C66;
  --line: #D8E2DE;
  --accent: #2F5BEA;
  --accent-ink: #FFFFFF;
  --danger: #D33A41;
  --good: #1D8A57;
  --scrim: rgba(12, 22, 18, .42);
  --shadow: 0 1px 2px rgba(20, 34, 29, .06), 0 6px 20px rgba(20, 34, 29, .06);

  --j0: #2FA36B; --j1: #F08A2B; --j2: #E4508A; --j3: #3A86F0;
  --j4: #8B5CF6; --j5: #D6A400; --j6: #13A0A0; --j7: #E5484D;

  --font-display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
}
/* "Auto" theme: follow the system, or the claude.ai viewer's own light/dark switch. */
@media (prefers-color-scheme: dark) {
  :root:not([data-skin]):not([data-theme="light"]) {
    --bg: #0E1412; --surface: #17201C; --ink: #E8F0EC; --muted: #93A49D; --line: #2A3631;
    --accent: #7F9BFF; --accent-ink: #0E1412; --danger: #FF6B70; --good: #4CC38A;
    --scrim: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-skin]) {
  --bg: #0E1412; --surface: #17201C; --ink: #E8F0EC; --muted: #93A49D; --line: #2A3631;
  --accent: #7F9BFF; --accent-ink: #0E1412; --danger: #FF6B70; --good: #4CC38A;
  --scrim: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
:root[data-skin="midnight"] {
  --bg: #000000; --surface: #121214; --ink: #F4F4F5; --muted: #9B9BA4; --line: #26262B;
  --accent: #A78BFA; --accent-ink: #0B0B0D; --danger: #FF6B70; --good: #4ADE80;
  --scrim: rgba(0, 0, 0, .72); --shadow: 0 0 0 1px #1E1E22;
  --j0: #34D399; --j1: #FB923C; --j2: #F472B6; --j3: #60A5FA;
  --j4: #A78BFA; --j5: #FACC15; --j6: #2DD4BF; --j7: #F87171;
  color-scheme: dark;
}
:root[data-skin="sunny"] {
  --bg: #FFFFFF; --surface: #FFFFFF; --ink: #1B1530; --muted: #6B6585; --line: #EEEAF6;
  --accent: #FF4F8B; --accent-ink: #FFFFFF; --danger: #E5383B; --good: #16A34A;
  --scrim: rgba(27, 21, 48, .35); --shadow: 0 2px 4px rgba(255, 79, 139, .06), 0 10px 28px rgba(80, 60, 160, .10);
  --j0: #22C55E; --j1: #FF8A00; --j2: #FF3D7F; --j3: #2D9CFF;
  --j4: #9B5CFF; --j5: #FFC400; --j6: #00C2B8; --j7: #FF4D4D;
  color-scheme: light;
}
:root[data-skin="holiday"] {
  --bg: #0F2A1F; --surface: #163A2B; --ink: #FFF7E8; --muted: #BFD3C5; --line: #24513C;
  --accent: #E23B4E; --accent-ink: #FFFFFF; --danger: #FF7A85; --good: #7EE2A8;
  --scrim: rgba(5, 15, 10, .6); --shadow: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.25);
  --j0: #5FD39A; --j1: #F2C14E; --j2: #FF8FA3; --j3: #8FD3FF;
  --j4: #B48CFF; --j5: #E9E4D4; --j6: #FF9F6B; --j7: #E23B4E;
  color-scheme: dark;
}
:root[data-skin="diwali"] {
  --bg: #1B1036; --surface: #2A1A4F; --ink: #FFF4DE; --muted: #CDBDE6; --line: #3D2A6B;
  --accent: #FF9F1C; --accent-ink: #1B1036; --danger: #FF6B81; --good: #7EE2A8;
  --scrim: rgba(10, 5, 25, .65); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
  --j0: #FFB627; --j1: #FF6F59; --j2: #F15BB5; --j3: #00BBF9;
  --j4: #B794F6; --j5: #FFD166; --j6: #2EC4B6; --j7: #EF476F;
  color-scheme: dark;
}
:root[data-skin="thanksgiving"] {
  --bg: #FFF6EC; --surface: #FFFFFF; --ink: #3B2414; --muted: #8A6A55; --line: #F0DCC8;
  --accent: #C8551F; --accent-ink: #FFFFFF; --danger: #C62828; --good: #2E7D32;
  --scrim: rgba(59, 36, 20, .4); --shadow: 0 2px 4px rgba(140, 90, 43, .08), 0 10px 28px rgba(140, 90, 43, .12);
  --j0: #D9822B; --j1: #B5452B; --j2: #E0A526; --j3: #7A8B3A;
  --j4: #8C5A2B; --j5: #C9A227; --j6: #4F7C6B; --j7: #A0303A;
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  position: relative; z-index: 1;
  max-width: 1040px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 120px;
  display: flex; flex-direction: column; gap: 22px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, .jar:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }

/* Header */
.top { display: grid; gap: 12px; }
.top-bar { display: flex; align-items: center; gap: 8px; }
/* The app name is a quiet label; the month and your jars are the stars. */
.brand { font-size: 1.02rem; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; margin-right: auto; opacity: .62; }
.brand-mark { width: 24px; height: 24px; border-radius: 7px; display: block; }
:root[data-skin="holiday"] .brand::after { content: "🎄"; font-size: 1.2rem; }
:root[data-skin="diwali"] .brand::after { content: "🪔"; font-size: 1.2rem; }
:root[data-skin="thanksgiving"] .brand::after { content: "🦃"; font-size: 1.2rem; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.month { display: flex; align-items: center; justify-content: space-between; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; width: 100%; max-width: 360px; margin: 0 auto; }
.month button { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 999px; font-size: 1.1rem; }
.month button:hover:not(:disabled) { background: var(--bg); }
.month button:disabled { opacity: .3; cursor: default; }
.month-label { flex: 1; text-align: center; font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); width: 42px; height: 42px; border-radius: 999px; font-size: 1.25rem; display: grid; place-items: center; }

/* Summary: a box of new mason jars seen from the top, one lid per jar, with a taped-on label. */
.summary { display: grid; gap: 10px; }
.eyebrow { font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.big { font-family: var(--font-display); font-size: clamp(2.2rem, 7vw, 3.2rem); font-weight: 600; line-height: 1.05; }
.jarbox {
  --box: #C9965B; --box-wall: #B8864E; --box-flap: #D3A469; --box-inside: #5E3F22; --box-print: #8A5F33;
  position: relative; width: 100%; max-width: 440px; margin: 0 auto;
}
:root[data-skin="holiday"] .jarbox { --box: #B3202F; --box-wall: #8E1B2A; --box-flap: #C42A3A; --box-inside: #4A0E18; --box-print: #F2C14E; }
.jarbox svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 10px 14px rgba(0,0,0,.16)); overflow: visible; }
.jarbox .b-flap { fill: var(--box-flap); }
.jarbox .b-crease { stroke: var(--box-wall); stroke-width: 1.5; }
.jarbox .b-wall { fill: var(--box-wall); }
.jarbox .b-inside { fill: var(--box-inside); }
.jarbox .b-ribbon { fill: #F2C14E; display: none; }
:root[data-skin="diwali"] .jarbox { --box: #6A2C91; --box-wall: #4E1F6E; --box-flap: #7B3AA6; --box-inside: #2B0F40; --box-print: #FFD166; }
:root[data-skin="holiday"] .jarbox .b-ribbon, :root[data-skin="diwali"] .jarbox .b-ribbon { display: inline; }
.jarbox .b-print { fill: var(--box-print); font-family: var(--font-display); font-weight: 700; }
.jarbox { max-width: 400px; }
.jarbox .b-front { fill: var(--box); }
.jarbox .s-plank { fill: var(--box); }
.jarbox .s-edge, .jarbox .s-bracket { fill: var(--box-wall); }
.jarbox .b-post { fill: var(--box-flap); }
.jarbox .b-plank { stroke: var(--box-wall); stroke-width: 2; }
.jarbox .b-grain { fill: none; stroke: var(--box-wall); stroke-width: 1.2; opacity: .45; }
.jarbox .b-hole { fill: var(--box-inside); }
.jarbox .b-nail { fill: var(--box-inside); opacity: .7; }
.cjar { cursor: pointer; }
.cjar .c-glass { fill: color-mix(in srgb, var(--surface) 72%, transparent); }
.cjar .c-fill { fill: var(--c); opacity: .9; }
.cjar .c-edge { fill: none; stroke: color-mix(in srgb, var(--c) 45%, #7A8C96); stroke-width: 1.6; }
.cjar.over .c-edge { stroke: var(--danger); stroke-width: 2.4; }
.cjar .c-shine { fill: #FFFFFF; opacity: .55; }
.cjar .c-neck { fill: color-mix(in srgb, var(--c) 30%, var(--surface)); }
.cjar .c-lid { fill: color-mix(in srgb, var(--c) 60%, #222); }

.box-sticker .sticker-sub { font-size: .8rem; font-weight: 600; color: #7A6650; margin-top: 1px; }
.pace b { color: var(--ink); }
.lid-g { cursor: pointer; }
.lid-g .l-glass { fill: rgba(255, 255, 255, .28); stroke: rgba(255, 255, 255, .5); stroke-width: 1; }
.lid-g .l-rim { fill: color-mix(in srgb, var(--c) 62%, #000); }
.lid-g .l-top { fill: var(--c); }
.lid-g .l-ring { fill: none; stroke: rgba(255, 255, 255, .35); stroke-width: 1.2; }
.lid-g .l-name { fill: #FFFFFF; font-family: var(--font-display); font-weight: 700; text-anchor: middle; paint-order: stroke; stroke: rgba(0, 0, 0, .28); stroke-width: 2px; }
.lid-g.over .l-rim { fill: var(--danger); }
.box-sticker {
  position: relative; margin: -34px auto 0; width: fit-content; min-width: 190px; max-width: 86%;
  background: #FFF8EC; color: #2A1E12; border-radius: 10px; padding: 8px 18px 10px; text-align: center;
  transform: rotate(-2deg); box-shadow: 0 6px 14px rgba(0,0,0,.18);
}
.box-sticker::before { content: ""; position: absolute; top: -9px; left: 50%; width: 64px; height: 18px; transform: translateX(-50%) rotate(3deg); background: rgba(255,255,255,.6); border: 1px solid rgba(0,0,0,.06); }
.summary .box-sticker .eyebrow { color: #7A6650; font-size: .66rem; }
.box-sticker .big { color: #2A1E12; font-size: clamp(1.5rem, 7vw, 2.2rem); }
.box-sticker.over .big, .summary .box-sticker.over .eyebrow { color: #D33A41; }
.sum-line { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; color: var(--muted); font-size: .92rem; }
.sum-line b { color: var(--ink); }
.stack { max-width: 440px; width: 100%; margin: 0 auto; height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; display: flex; }
.stack i { display: block; height: 100%; }
.pace { color: var(--muted); font-size: .9rem; text-align: center; }

/* Jars */
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-head h2 { font-size: 1.25rem; }
.hint { color: var(--muted); font-size: .8rem; font-weight: 500; }
.link-btn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 6px 2px; }
.jars { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 14px; }
.jar {
  --c: var(--j0);
  position: relative; border: 0; background: none; padding: 0;
  display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  transition: transform .15s ease, opacity .15s ease;
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
}
.jar:hover { transform: translateY(-3px); }
.jar:active { transform: scale(.97); }
.jar:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 18px; }
.jar.drag-src { opacity: .25; }
.drag-ghost { position: fixed; z-index: 90; pointer-events: none; transform: translate(-50%, -55%) scale(1.06) rotate(-3deg); filter: drop-shadow(0 16px 20px rgba(0,0,0,.28)); }
.jar-art { position: relative; width: 100%; max-width: 168px; }
.jar-art svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 6px 10px rgba(0,0,0,.10)); }
.jar-art .glass { fill: color-mix(in srgb, var(--c) 8%, var(--surface)); }
.jar-art .glass-edge { fill: none; stroke: color-mix(in srgb, var(--c) 45%, var(--line)); stroke-width: 2.5; }
.jar.over .jar-art .glass-edge { stroke: var(--danger); stroke-width: 3; }
.jar-art .lid { fill: color-mix(in srgb, var(--c) 55%, var(--ink)); }
.jar-art .neck { fill: color-mix(in srgb, var(--c) 30%, var(--surface)); }
.jar-art .shine { fill: #FFFFFF; opacity: .45; }
.jar-art .liquid { transition: transform 1.2s cubic-bezier(.25, .9, .3, 1.15); }
.jar-art .wave { fill: var(--c); }
.jar-art .wave.back { opacity: .45; animation: slosh 5.5s linear infinite reverse; }
.jar-art .wave.front { opacity: .9; animation: slosh 3.2s linear infinite; }
@keyframes slosh { to { transform: translateX(50px); } }
.jar-art .jar-emoji { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); font-size: 2.1rem; line-height: 1; filter: drop-shadow(0 1px 1px rgba(0,0,0,.2)); }
.jar-label {
  position: absolute; left: 50%; top: 72%; transform: translate(-50%, -50%);
  background: color-mix(in srgb, var(--surface) 92%, transparent); color: var(--ink);
  border-radius: 10px; padding: 3px 10px 4px; box-shadow: 0 1px 3px rgba(0,0,0,.15);
  font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; line-height: 1.1; white-space: nowrap;
  max-width: 66%; overflow: hidden; text-overflow: ellipsis;
}
.jar-label small { display: block; font-family: var(--font-body); font-weight: 600; font-size: .62rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.jar.over .jar-label { color: var(--danger); }
.jar-name { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jar-sub { color: var(--muted); font-size: .82rem; margin-top: -4px; }
.pill { position: absolute; top: 4px; right: 6px; z-index: 1; font-size: .66rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 7px; border-radius: 999px; background: var(--bg); color: var(--muted); }
.pill.warn { background: color-mix(in srgb, var(--j5) 30%, var(--surface)); color: var(--ink); }
.pill.bad { background: var(--danger); color: var(--surface); }
.pill.empty { background: var(--ink); color: var(--surface); }
.jar.add { justify-content: center; color: var(--muted); font-weight: 600; border: 2px dashed var(--line); border-radius: 22px; min-height: 200px; }
.jar.add span:first-child { font-size: 2rem; line-height: 1; }

/* Rows (expenses) */
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row-emoji { width: 38px; height: 38px; flex: none; border-radius: 12px; display: grid; place-items: center; font-size: 1.25rem; background: color-mix(in srgb, var(--c, var(--j0)) 20%, transparent); }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-meta { color: var(--muted); font-size: .84rem; }
.row-amt { font-weight: 700; }
.row-del { border: 0; background: none; color: var(--muted); width: 34px; height: 34px; border-radius: 10px; font-size: 1.1rem; flex: none; }
.row-del:hover { background: var(--bg); color: var(--danger); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.notice { font-size: .85rem; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; }
.foot { text-align: center; color: var(--muted); font-size: .82rem; margin: 0; }
.foot a { color: inherit; }

/* FAB */
.fab {
  position: fixed; z-index: 20;
  right: max(20px, calc(env(safe-area-inset-right, 0px) + 20px));
  bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 16px));
  border: 0; border-radius: 999px; padding: 16px 24px 16px 20px;
  background: var(--accent); color: var(--accent-ink);
  font-family: var(--font-display); font-weight: 600; font-size: 1.1rem;
  box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 45%, transparent);
  display: flex; align-items: center; gap: 8px;
}
.fab b { font-size: 1.5rem; line-height: 1; font-weight: 500; }
/* Leave room on narrow screens for the paper-clip tab on the right edge. */
@media (max-width: 640px) {
  .wrap { padding-right: max(44px, env(safe-area-inset-right, 0px)); }
  .top { margin-right: calc(max(16px, env(safe-area-inset-right, 0px)) - max(44px, env(safe-area-inset-right, 0px))); }
}

/* Expenses drawer, opened by a paper-clipped tab on the right edge. */
.clip-tab {
  position: fixed; z-index: 25; right: 0; top: 46%;
  border: 1px solid var(--line); border-right: 0; background: var(--surface); color: var(--ink);
  border-radius: 14px 0 0 14px; padding: 18px 8px 12px 9px;
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  box-shadow: -4px 4px 14px rgba(0,0,0,.14);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.clip-tab svg { position: absolute; top: -18px; left: 50%; width: 18px; height: 40px; transform: translateX(-50%) rotate(8deg); }
.clip-tab span { writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--font-display); font-weight: 600; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
.clip-tab b { font-size: .7rem; min-width: 20px; padding: 1px 5px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
.drawer-scrim { position: fixed; inset: 0; z-index: 44; background: var(--scrim); }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 45; width: min(420px, 92vw);
  background: var(--surface); color: var(--ink); box-shadow: -20px 0 50px rgba(0,0,0,.25);
  transform: translateX(105%); transition: transform .28s cubic-bezier(.3,.8,.3,1), visibility 0s .28s;
  display: flex; flex-direction: column; visibility: hidden;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.drawer.open { transform: none; visibility: visible; transition: transform .28s cubic-bezier(.3,.8,.3,1), visibility 0s; }
.drawer.left { right: auto; left: 0; transform: translateX(-105%); box-shadow: 20px 0 50px rgba(0,0,0,.25); padding-right: 0; padding-left: env(safe-area-inset-left, 0px); }
.drawer.left.open { transform: none; }
.month .month-label { width: auto; height: auto; flex: 1; font-size: 1.1rem; padding: 8px 4px; }
/* Until the months drawer has been opened once, a soft pulsing dot hints that the month is tappable. */
.month { position: relative; }
.month.fresh::after { content: ""; position: absolute; top: 6px; right: 46px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: hintPulse 1.8s ease-in-out infinite; pointer-events: none; }
@keyframes hintPulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 60% { box-shadow: 0 0 0 7px transparent; } }
.month-label .caret { font-size: .7rem; color: var(--muted); }
/* Months drawer: chart, tips and a row per month */
.m-body { overflow: auto; flex: 1; padding: 4px 16px 24px; display: grid; gap: 16px; align-content: start; }
.m-badges { display: flex; gap: 8px; flex-wrap: wrap; }
.m-card { background: color-mix(in srgb, var(--accent) 6%, var(--surface)); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 10px; }
.m-card h4 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
.m-chart svg { display: block; width: 100%; height: auto; }
.m-chart .bud { fill: color-mix(in srgb, var(--ink) 10%, transparent); }
.m-chart .sp { fill: var(--good); }
.m-chart .sp.over { fill: var(--danger); }
.m-chart .sp.now { fill: var(--accent); }
.m-chart text { fill: var(--muted); font-size: 9px; font-weight: 600; }
.m-legend { display: flex; gap: 14px; color: var(--muted); font-size: .78rem; font-weight: 600; }
.m-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.tip { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.tip p { margin: 0; font-size: .92rem; }
.tip .actions .btn { padding: 9px 14px; }
.m-row { display: flex; align-items: center; gap: 12px; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px; text-align: left; }
.m-row + .m-row { margin-top: 8px; }
.m-row .row-main b { font-family: var(--font-display); font-weight: 600; font-size: 1.02rem; }
.m-row .m-status { font-weight: 700; font-size: .86rem; text-align: right; white-space: nowrap; }
.m-row .m-status.good { color: var(--good); } .m-row .m-status.bad { color: var(--danger); }
.m-row.current { box-shadow: inset 0 0 0 2px var(--accent); }
.drawer-head { padding: 18px 18px 12px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.drawer-head .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.drawer-head .chip { flex: none; padding: 6px 12px; font-size: .88rem; }
.drawer-list { overflow: auto; flex: 1; }
.day-head { position: sticky; top: 0; background: var(--surface); padding: 10px 16px 4px; font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }

/* Sheets */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 20px; }
.sheet {
  background: var(--surface); color: var(--ink); width: 100%; max-width: 480px; max-height: 88vh; overflow: auto;
  border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
.sheet.anim { animation: rise .22s ease-out; }
@keyframes rise { from { transform: translateY(16px); opacity: .6; } }
@media (max-width: 560px) {
  .scrim { align-items: flex-end; padding: 0; }
  .sheet { max-width: none; border-radius: 24px 24px 0 0; padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
  /* A grab handle hints that the sheet can be swiped down. */
  .sheet { position: relative; padding-top: 30px; }
  .sheet::before { content: ""; position: absolute; top: 10px; left: 50%; width: 42px; height: 5px; margin-left: -21px; border-radius: 999px; background: var(--line); }
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h3 { font-size: 1.35rem; }
.x { border: 0; background: var(--bg); width: 36px; height: 36px; border-radius: 999px; font-size: 1.1rem; flex: none; }
label.f, .f { display: grid; gap: 6px; font-weight: 600; font-size: .9rem; }
input.t, select.t, textarea.t {
  font: inherit; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 14px;
  padding: 12px 14px; width: 100%; font-weight: 500;
}
textarea.t { min-height: 120px; resize: vertical; }
input.t:focus, select.t:focus, textarea.t:focus { border-color: var(--accent); outline: none; }
select.t { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px; }
.amount-wrap { position: relative; }
.amount-wrap > span { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-family: var(--font-display); font-size: 2rem; color: var(--muted); pointer-events: none; }
input.amount { font-family: var(--font-display); font-size: 2.4rem; font-weight: 600; }
.ops { display: flex; gap: 8px; align-items: center; }
.ops button { border: 0; background: var(--bg); border-radius: 12px; min-width: 52px; padding: 8px 14px; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; }
.calc { color: var(--muted); font-weight: 600; font-size: .95rem; margin-left: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px;
  font-weight: 600; display: flex; align-items: center; gap: 6px;
}
/* A picked chip is filled in its color with a ✓, so it never looks like it still needs a tap. */
.chip[aria-pressed="true"] { border-color: var(--c, var(--accent)); background: var(--c, var(--accent)); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
.chip[aria-pressed="true"]::after { content: "✓"; font-weight: 800; margin-left: 2px; }
@keyframes flashIn { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); border-color: var(--accent); } 100% { box-shadow: 0 0 0 10px transparent; } }
.past-note { background: color-mix(in srgb, var(--j5) 22%, var(--surface)); border-radius: 12px; padding: 8px 12px; font-size: .9rem; font-weight: 600; margin-top: -4px; }
input.t.flash { animation: flashIn .9s ease-out; border-color: var(--accent); }
.emojis { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
.emojis button { border: 2px solid transparent; background: var(--bg); border-radius: 12px; height: 42px; font-size: 1.3rem; }
.emojis button[aria-pressed="true"] { border-color: var(--accent); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatches button { width: 34px; height: 34px; border-radius: 999px; border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--line); }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .two { grid-template-columns: 1fr; } }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 14px; padding: 13px 18px; font-weight: 700; background: var(--bg); }
.btn.primary { background: var(--accent); color: var(--accent-ink); flex: 1; }
.btn.danger { background: transparent; color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: var(--surface); }
.err { color: var(--danger); font-size: .88rem; font-weight: 600; }
.detail-top { display: grid; gap: 8px; }
.bar { height: 12px; border-radius: 999px; background: var(--bg); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c); border-radius: 999px; }
.detail-list { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.detail-list .row { padding: 10px 12px; }
.confirm { background: color-mix(in srgb, var(--danger) 10%, var(--surface)); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; }
/* Theme picker: little tiles in each theme's own colors. */
.themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.theme-opt { position: relative; display: grid; justify-items: center; gap: 6px; padding: 6px 4px 8px; border: 2px solid transparent; background: none; border-radius: 18px; transition: transform .15s ease; }
.theme-opt:active { transform: scale(.95); }
.theme-opt b { font-family: var(--font-display); font-weight: 600; font-size: .86rem; line-height: 1.1; }
.theme-chip { position: relative; width: 100%; aspect-ratio: 1.35; border-radius: 14px; background: var(--t0); box-shadow: inset 0 0 0 1px rgba(128,128,128,.25); display: grid; place-items: center; overflow: hidden; }
.theme-chip span { font-size: 1.7rem; line-height: 1; position: relative; z-index: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,.25)); }
.theme-chip i { position: absolute; border-radius: 50%; }
.theme-chip i:nth-of-type(1) { width: 46%; aspect-ratio: 1; background: var(--t1); left: -10%; bottom: -18%; }
.theme-chip i:nth-of-type(2) { width: 30%; aspect-ratio: 1; background: var(--t2); right: -6%; top: -10%; }
.theme-opt[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.theme-opt[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 0; right: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: .72rem; font-weight: 800; display: grid; place-items: center; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--bg); border-radius: 14px; font-weight: 600; }
.set-row small { display: block; color: var(--muted); font-weight: 500; font-size: .82rem; }
.set-row input[type="time"] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(20px); }
.switch input:focus-visible + i { outline: 3px solid var(--accent); outline-offset: 2px; }
.links { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.version { color: var(--muted); font-size: .8rem; text-align: center; }
.news { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.news li { display: flex; gap: 12px; align-items: flex-start; background: var(--bg); border-radius: 14px; padding: 10px 12px; }
.news li span { font-size: 1.4rem; line-height: 1.2; }
.copy-box { display: flex; gap: 8px; align-items: center; background: var(--bg); border-radius: 12px; padding: 8px 8px 8px 12px; font-weight: 600; }
.copy-box code { flex: 1; font: inherit; user-select: all; overflow-wrap: anywhere; }

/* Confirm dialog */
.confirm-scrim { z-index: 70; align-items: center !important; padding: 16px !important; }
.dialog { background: var(--surface); color: var(--ink); border-radius: 22px; padding: 22px; width: min(380px, calc(100vw - 32px)); display: grid; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.3); animation: pop .18s ease-out; }
.dialog h3 { font-size: 1.25rem; }
.dialog p { margin: 0; color: var(--muted); }
.dialog .actions .btn { flex: 1; }
@keyframes pop { from { transform: scale(.94); opacity: .5; } }

.toast {
  position: fixed; z-index: 75; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
  background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 22px; font-weight: 600;
  box-shadow: var(--shadow); width: max-content; max-width: min(420px, calc(100% - 32px)); text-align: center; line-height: 1.35;
}

/* First-run tour: spotlight, bouncing arrow, and a label bubble. */
.tour { position: fixed; inset: 0; z-index: 80; }
.tour-spot { position: fixed; border-radius: 18px; box-shadow: 0 0 0 9999px rgba(8, 12, 22, .66); transition: all .3s ease; pointer-events: none; }
.tour-bubble { position: fixed; width: min(320px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); border-radius: 18px; padding: 16px 16px 14px; box-shadow: 0 14px 40px rgba(0,0,0,.35); display: grid; gap: 8px; }
.tour-bubble b { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; }
.tour-bubble p { margin: 0; color: var(--muted); }
.tour-bubble .actions { align-items: center; }
.tour-step { color: var(--muted); font-size: .8rem; font-weight: 600; margin-right: auto; }
.tour-arrow { position: fixed; width: 44px; height: 44px; margin-left: -22px; color: #FFD34D; filter: drop-shadow(0 2px 4px rgba(0,0,0,.45)); }
.tour-arrow.down { animation: bobDown .6s ease-in-out infinite alternate; }
.tour-arrow.up { animation: bobUp .6s ease-in-out infinite alternate; }
.tour-arrow.up svg { transform: rotate(180deg); }
@keyframes bobDown { to { transform: translateY(10px); } }
@keyframes bobUp { to { transform: translateY(-10px); } }

/* Startup animation: two coins drop into the jar, it fills, and the name appears. */
#intro { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, #4C74FF, #2F5BEA 55%, #2448C4); transition: opacity .35s ease; cursor: pointer; }
#intro.out { opacity: 0; }
.intro-stage { display: grid; justify-items: center; gap: 6px; }
.intro-jar { width: 150px; height: auto; overflow: visible; }
.intro-coin { animation: coinDrop .6s cubic-bezier(.55, 0, .8, .2) both; }
.intro-coin.c2 { animation-delay: .32s; }
@keyframes coinDrop { 0% { transform: translateY(-260px) rotate(-40deg); opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(0) rotate(0); opacity: 0; } }
.intro-liquid { animation: fillUp .75s .6s cubic-bezier(.3, .8, .3, 1.1) both; }
@keyframes fillUp { from { transform: translateY(96px); } }
.intro-lid { animation: lidOn .35s 1.15s cubic-bezier(.3, .8, .3, 1.2) both; }
@keyframes lidOn { from { transform: translate(-46px, -26px) rotate(-28deg); } }
.intro-word { font-family: var(--font-display); font-weight: 700; font-size: 2.6rem; color: #FFFFFF; animation: wordIn .45s 1.05s both; }
.intro-tag { font-weight: 500; color: rgba(255, 255, 255, .88); animation: wordIn .45s 1.2s both; }
@keyframes wordIn { from { opacity: 0; transform: translateY(10px); } }

/* Holiday snow */
#snow { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
#snow i { position: absolute; top: -12px; border-radius: 50%; background: #FFFFFF; opacity: .55; animation: snow linear infinite; }
@keyframes snow { to { transform: translate3d(var(--drift, 20px), 105vh, 0); } }
/* Diwali sparkles rise; Thanksgiving leaves tumble down. */
#snow i.spark { top: auto; bottom: -12px; background: #FFD166; opacity: .8; box-shadow: 0 0 6px 2px rgba(255, 170, 40, .65); animation-name: spark; }
@keyframes spark { 0% { transform: translate3d(0, 0, 0); opacity: 0; } 15% { opacity: .9; } 50% { opacity: .35; } 70% { opacity: .9; } 100% { transform: translate3d(var(--drift, 20px), -105vh, 0); opacity: 0; } }
#snow i.leaf { background: none; border-radius: 0; opacity: .55; line-height: 1; animation-name: leaf; }
@keyframes leaf { to { transform: translate3d(var(--drift, 20px), 105vh, 0) rotate(540deg); } }
/* Diwali fireworks: each burst is a ring of sparks flying out from a point, then it moves somewhere new. */
#snow .fw { position: absolute; width: 0; height: 0; }
#snow .fw i { position: absolute; left: -2px; top: -9px; width: 4px; height: 18px; border-radius: 3px; background: linear-gradient(var(--fc), #FFFFFF); box-shadow: 0 0 8px 2px var(--fc);
  opacity: 0; animation: fwSpark var(--dur, 4s) cubic-bezier(.15, .7, .3, 1) infinite; animation-delay: var(--delay, 0s); }
#snow .fw b { position: absolute; left: -26px; top: -26px; width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(circle, #FFFFFF, var(--fc) 40%, transparent 70%);
  opacity: 0; animation: fwFlash var(--dur, 4s) ease-out infinite; animation-delay: var(--delay, 0s); }
@keyframes fwSpark {
  0% { transform: rotate(var(--a)) translateY(0) scaleY(.3); opacity: 0; }
  3% { opacity: 1; }
  32% { transform: rotate(var(--a)) translateY(calc(var(--r) * -1)) scaleY(1); opacity: .95; }
  50% { transform: rotate(var(--a)) translateY(calc(var(--r) * -1.15 + 18px)) scaleY(.6); opacity: 0; }
  100% { opacity: 0; }
}
@keyframes fwFlash { 0% { transform: scale(.2); opacity: 0; } 3% { opacity: .9; } 14% { transform: scale(1.6); opacity: 0; } 100% { opacity: 0; } }
/* Bottom-of-screen decorations: a row of diyas for Diwali, a harvest table for Thanksgiving. */
#snow .ground { position: absolute; left: 0; right: 0; bottom: max(6px, env(safe-area-inset-bottom, 0px)); text-align: center; white-space: nowrap; overflow: hidden; line-height: 1; opacity: .5; }
#snow .ground span { display: inline-block; margin: 0 6px; animation: flicker 2.2s ease-in-out infinite alternate; }
#snow .ground span:nth-child(3n) { animation-delay: -.7s; } #snow .ground span:nth-child(3n+1) { animation-delay: -1.4s; }
@keyframes flicker { to { transform: translateY(-2px) scale(1.06); filter: brightness(1.25); } }
:root[data-skin="thanksgiving"] #snow .ground span { animation: none; }
#snow .garland { position: absolute; top: 0; left: 0; right: 0; height: 40px; white-space: nowrap; overflow: hidden; text-align: center; opacity: .5; line-height: 1; }
#snow .garland::before { content: ""; position: absolute; left: -5%; right: -5%; top: -40px; height: 60px; border-bottom: 2px solid #A0703A; border-radius: 0 0 50% 50%; opacity: .5; }
#snow .garland span { display: inline-block; margin: 0 5px; transform-origin: 50% 0; animation: sway 3s ease-in-out infinite alternate; }
#snow .garland span:nth-child(odd) { animation-delay: -1.5s; }
@keyframes sway { from { transform: translateY(var(--y, 6px)) rotate(-12deg); } to { transform: translateY(var(--y, 6px)) rotate(12deg); } }
:root[data-skin="diwali"] body { background: radial-gradient(ellipse at 50% 0%, #3A1E6E 0%, transparent 60%), radial-gradient(ellipse at 50% 100%, #4A2160 0%, transparent 55%), var(--bg); background-attachment: fixed; }
:root[data-skin="thanksgiving"] body { background: radial-gradient(circle at 10% 5%, #FFE2BF 0%, transparent 45%), radial-gradient(circle at 95% 40%, #FFE9D2 0%, transparent 40%), radial-gradient(ellipse at 50% 100%, #F9DCC0 0%, transparent 50%), var(--bg); background-attachment: fixed; }

/* v1.2: badges line, editable rows, recurring, wrap, stickers */
.badges { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
.mini { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: .85rem; font-weight: 600; color: var(--ink); }
.row[data-edit-spend] { cursor: pointer; }
.row[data-edit-spend]:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.set-group { display: grid; gap: 8px; }
.set-group .eyebrow { margin-top: 4px; }
.btn-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.due { display: grid; gap: 10px; }
.due-item { display: flex; align-items: center; gap: 12px; background: var(--bg); border-radius: 16px; padding: 12px; }
.due-item .row-main b { font-family: var(--font-display); font-weight: 600; }
.due-item .actions { flex-wrap: nowrap; }
.due-item .btn { padding: 10px 14px; }
.wrap-card { position: relative; overflow: hidden; border-radius: 20px; padding: 20px; display: grid; gap: 12px;
  background: linear-gradient(150deg, color-mix(in srgb, var(--accent) 22%, var(--surface)), color-mix(in srgb, var(--j4) 18%, var(--surface))); }
.wrap-card h4 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; }
.wrap-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wrap-stat { background: color-mix(in srgb, var(--surface) 80%, transparent); border-radius: 14px; padding: 10px 12px; }
.wrap-stat b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; line-height: 1.2; overflow-wrap: anywhere; }
.wrap-stat span { color: var(--muted); font-size: .8rem; font-weight: 600; }
.wrap-stat.wide { grid-column: 1 / -1; }
.confetti { position: absolute; inset: 0; pointer-events: none; }
.confetti i { position: absolute; top: -10px; width: 7px; height: 11px; border-radius: 2px; animation: confetti 2.4s ease-in forwards; }
@keyframes confetti { to { transform: translate3d(var(--drift, 0), 420px, 0) rotate(720deg); opacity: 0; } }
.stickers { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.sticker { display: grid; justify-items: center; gap: 4px; text-align: center; background: var(--bg); border-radius: 16px; padding: 12px 6px; }
.sticker span { font-size: 2rem; line-height: 1.1; }
.sticker b { font-size: .82rem; line-height: 1.2; }
.sticker small { color: var(--muted); font-size: .72rem; line-height: 1.25; }
.sticker.got span { filter: drop-shadow(0 2px 3px rgba(0,0,0,.2)); animation: pop .3s ease-out; }
.sticker:not(.got) span { filter: grayscale(1); opacity: .35; }
/* Settings sections: tap to open, tap again to close. */
.accs { display: grid; gap: 8px; }
.acc { background: var(--bg); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.acc-head { width: 100%; border: 0; background: none; display: flex; align-items: center; gap: 12px; padding: 14px; text-align: left; }
.acc-head b { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
.acc-icon { font-size: 1.3rem; width: 26px; text-align: center; }
.acc-sum { margin-left: auto; color: var(--muted); font-size: .86rem; font-weight: 600; text-align: right; }
.acc-chev { color: var(--muted); font-size: 1.3rem; line-height: 1; transition: transform .2s ease; }
.acc.open .acc-chev { transform: rotate(90deg); }
.acc-body { display: grid; gap: 12px; padding: 0 14px 16px; animation: accIn .2s ease-out; }
@keyframes accIn { from { opacity: 0; transform: translateY(-4px); } }
.acc-body .set-row, .acc-body .btn:not(.primary), .acc-body input.t, .acc-body select.t { background: var(--surface); }
.homes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.home-opt { position: relative; display: grid; gap: 6px; justify-items: center; border: 2px solid transparent; background: var(--surface); border-radius: 16px; padding: 10px 8px 8px; }
.home-opt b { font-family: var(--font-display); font-weight: 600; font-size: .92rem; }
.home-opt[aria-pressed="true"] { border-color: var(--accent); }
.home-opt[aria-pressed="true"]::after { content: "✓"; position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: .75rem; font-weight: 800; display: grid; place-items: center; }
.home-prev { display: block; width: 100%; height: 74px; pointer-events: none; }
.home-prev svg { width: 100%; height: 100%; filter: none; }
.kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kind-opt { display: grid; gap: 2px; justify-items: start; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: 12px; }
.kind-opt span { font-size: 1.5rem; }
.kind-opt b { font-family: var(--font-display); font-weight: 600; }
.kind-opt small { color: var(--muted); font-size: .78rem; line-height: 1.3; }
.kind-opt[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.pill.good { background: color-mix(in srgb, var(--good) 22%, var(--surface)); color: var(--ink); }
/* Partner sync */
/* Header chips (partner sync, rhythm) share one layout so emoji and text sit centered on every phone. */
.partner-chip, .rhythm-chip { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 42px; padding: 0 13px; line-height: 1; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; font-weight: 700; font-size: .9rem; white-space: nowrap; }
.partner-chip i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.partner-chip i.on { background: var(--good); }
.partner-chip.warn { background: color-mix(in srgb, var(--j5) 22%, var(--surface)); }
#partnerSlot, #rhythmSlot { display: contents; }
.pair-hero { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 6px 0; }
.pair-title { font-family: var(--font-display); font-size: 1.15rem; }
.radar { position: relative; width: 150px; height: 150px; display: grid; place-items: center; }
.radar i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; animation: radar 2.4s ease-out infinite; }
.radar i:nth-child(2) { animation-delay: .8s; } .radar i:nth-child(3) { animation-delay: 1.6s; }
@keyframes radar { from { transform: scale(.3); opacity: .6; } to { transform: scale(1); opacity: 0; } }
.radar b { font-size: 2.8rem; z-index: 1; }
.code { display: flex; gap: 10px; justify-content: center; }
.code span { font-family: var(--font-display); font-weight: 700; font-size: 2.2rem; width: 52px; height: 64px; border-radius: 14px; background: var(--bg); border: 2px solid var(--line); display: grid; place-items: center; }
.found { display: flex; align-items: center; gap: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.found > span { font-size: 1.8rem; }
.found b { font-family: var(--font-display); font-weight: 600; }
.found .btn { flex: none; }
.choice { display: grid; gap: 10px; }
.choice-opt { display: grid; gap: 2px; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: 12px 14px; }
.choice-opt b { font-family: var(--font-display); font-weight: 600; }
.choice-opt small { color: var(--muted); font-size: .84rem; }
.choice-opt[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.privacy-note { display: flex; gap: 8px; align-items: flex-start; background: color-mix(in srgb, var(--good) 10%, var(--surface)); border-radius: 14px; padding: 10px 12px; font-size: .86rem; }
.who { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font-size: .62rem; font-weight: 800; color: #fff; margin-left: 6px; vertical-align: 1px; }
.flags { display: grid; gap: 12px; }
.flags h4 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
.flag { display: grid; gap: 10px; border: 1px solid var(--line); border-radius: 16px; padding: 12px; background: color-mix(in srgb, var(--j5) 8%, var(--surface)); }
.flag-q { font-weight: 600; font-size: .92rem; }
.flag-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.flag-opt, .flag-one { display: grid; gap: 2px; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px; font-size: .9rem; }
button.flag-opt:hover { border-color: var(--accent); }
.flag-opt small { color: var(--muted); font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; }
/* Statement import */
.imp-steps { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.imp-steps li { display: flex; gap: 12px; align-items: flex-start; background: var(--bg); border-radius: 14px; padding: 10px 12px; font-size: .92rem; }
.imp-steps li::before { counter-increment: s; content: counter(s); flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; font-size: .8rem; }
.bank-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.bank-chips span { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: .8rem; font-weight: 600; color: var(--muted); }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tab { flex: none; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .85rem; font-weight: 700; }
.tab.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.imp-list { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.imp-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
.imp-row:first-child { border-top: 0; }
.imp-row input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.imp-row .row-main { flex: 1; min-width: 0; }
.imp-row .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.imp-row .m { color: var(--muted); font-size: .78rem; }
.imp-row .amt { font-weight: 700; }
.imp-row.off { opacity: .5; }
.jar-pick { display: inline-flex; align-items: center; gap: 4px; border: 2px solid var(--c, var(--line)); background: color-mix(in srgb, var(--c, var(--line)) 14%, var(--surface)); color: var(--ink); border-radius: 999px; padding: 2px 9px; font-size: .76rem; font-weight: 700; margin-top: 4px; }
.jar-pick.need { --c: var(--j5); }
.tag { font-size: .62rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: 2px 7px; margin-left: 6px; vertical-align: 1px; }
.tag.dup { background: var(--bg); color: var(--muted); }
.match { margin: -4px 12px 10px 42px; background: color-mix(in srgb, var(--j5) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--j5) 45%, var(--line)); border-radius: 12px; padding: 10px; display: grid; gap: 8px; }
.match-q { font-size: .86rem; }
.match-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.match-btns .btn { padding: 7px 10px; font-size: .8rem; background: var(--surface); }
.match.done { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; font-size: .8rem; color: var(--muted); background: var(--bg); border-color: var(--line); }
.match.done .link-btn { padding: 2px; font-size: .8rem; }
.sum-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: .88rem; color: var(--muted); }
.sum-bar b { color: var(--ink); }
.rate-faces { font-size: 2.6rem; text-align: center; letter-spacing: .1em; }

@media (prefers-reduced-motion: reduce) {
  .jar-art .wave, #snow, .tour-arrow, .month.fresh::after, .radar i { animation: none !important; }
  .jar-art .liquid, .drawer, .jar { transition: none; }
  .sheet.anim, .dialog, .confetti { animation: none; }
  .confetti { display: none; }
  #snow { display: none; }
}

:root[data-skin="paper"] body { background: var(--paper) 0 0 / 800px 800px, var(--bg); background-blend-mode: multiply; background-attachment: fixed; }
:root[data-skin="paper"] .brand { opacity: .55; }
:root[data-skin="paper"] :is(.rhythm-chip, .clip-tab, .jarbox) { display: none !important; }
:root[data-skin="paper"] .section-head { display: none; }
:root[data-skin="paper"] .icon-btn { border: 0; background: transparent; filter: grayscale(1) opacity(.6); }
:root[data-skin="paper"] .month { border: 0; background: transparent; box-shadow: none; max-width: 260px; margin-inline: auto; }
:root[data-skin="paper"] .month-label { font-weight: 600; color: var(--muted); }
/* the hero: one number in a hand-drawn ring, expenses tucked beside it */
:root[data-skin="paper"] .summary { position: relative; display: grid; gap: 10px; padding-top: 6px; }
:root[data-skin="paper"] .hero { text-align: center; }
:root[data-skin="paper"] .hero { padding: 0 64px; }
:root[data-skin="paper"] .hero-num { position: relative; display: inline-block; padding: 12px 22px 4px; }
:root[data-skin="paper"] .hero-ring { position: absolute; inset: 0 -4px -6px; width: calc(100% + 8px); height: calc(100% + 6px); overflow: visible; pointer-events: none; }
:root[data-skin="paper"] .hero-ring path { fill: none; stroke: color-mix(in srgb, var(--ink) 55%, transparent); stroke-width: 2.4; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-dasharray: 1000; animation: ringDraw .9s ease-out both; }
:root[data-skin="paper"] .hero.over .hero-ring path { stroke: color-mix(in srgb, var(--soft-over) 70%, transparent); }
@keyframes ringDraw { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { :root[data-skin="paper"] .hero-ring path { animation: none; } }
:root[data-skin="paper"] .hero .big { font-family: var(--num); font-weight: 700; font-size: clamp(2.6rem, 13vw, 3.7rem); line-height: 1.05; white-space: nowrap; color: var(--ink); }
:root[data-skin="paper"] .hero.over .big { color: var(--soft-over); }
:root[data-skin="paper"] .hero .big.long { font-size: clamp(2rem, 10vw, 2.8rem); }
:root[data-skin="paper"] .cents { font-size: .42em; color: var(--muted); vertical-align: 1em; margin-left: 2px; }
:root[data-skin="paper"] .hero .eyebrow { text-transform: none; letter-spacing: 0; font-size: 1rem; font-weight: 500; color: var(--muted); margin-top: 6px; }
:root[data-skin="paper"] .summary .pace { text-align: center; font-size: .95rem; color: var(--muted); margin: 0; }
:root[data-skin="paper"] .summary .pace b { color: var(--ink); font-family: var(--num); font-size: 1.15rem; }
:root[data-skin="paper"] .win-row { text-align: center; }
:root[data-skin="paper"] .win { display: inline-block; font-size: .85rem; font-weight: 600; color: #3E8A62; background: rgba(143,207,174,.28); border-radius: 999px; padding: 5px 12px; }
:root[data-skin="paper"] .exp-chip { position: absolute; right: 0; top: 14px; z-index: 2; display: grid; justify-items: center; width: 62px; padding: 8px 0 6px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.78); color: var(--ink); line-height: 1.1; box-shadow: 0 2px 8px rgba(0,0,0,.05); cursor: pointer; }
:root:not([data-skin="paper"]) .exp-chip { display: none; }
:root[data-skin="paper"] .exp-chip span { font-size: 1.15rem; }
:root[data-skin="paper"] .exp-chip b { font-family: var(--num); font-size: 1.2rem; margin-top: 2px; }
:root[data-skin="paper"] .exp-chip small { font-size: .68rem; color: var(--muted); }
/* jars: three across, pastel, number under each */
:root[data-skin="paper"] .jars { grid-template-columns: repeat(3, 1fr); gap: 22px 10px; }
:root[data-skin="paper"] .jar { gap: 0; background: transparent; border: 0; box-shadow: none; padding: 0; }
:root[data-skin="paper"] .jar-art { max-width: 92px; }
:root[data-skin="paper"] .jar-art svg { filter: drop-shadow(0 3px 5px rgba(0,0,0,.06)); }
:root[data-skin="paper"] .jar-art .glass { fill: color-mix(in srgb, var(--c) 14%, #fff); }
:root[data-skin="paper"] .jar-art .glass-edge { stroke: color-mix(in srgb, var(--c) 70%, #fff); stroke-width: 2.4; }
:root[data-skin="paper"] .jar.over .jar-art .glass-edge { stroke: color-mix(in srgb, var(--soft-over) 55%, #fff); stroke-dasharray: 5 4; }
:root[data-skin="paper"] .jar-art .lid { fill: var(--c); }
:root[data-skin="paper"] .jar-art .neck { fill: color-mix(in srgb, var(--c) 35%, #fff); }
:root[data-skin="paper"] .jar-art .jar-emoji { font-size: 1.45rem; top: 46%; }
:root[data-skin="paper"] .jar-amt { font-family: var(--num); font-weight: 700; font-size: 1.4rem; line-height: 1.1; margin-top: 6px; color: var(--ink); }
:root[data-skin="paper"] .jar.over .jar-amt { color: var(--soft-over); }
:root[data-skin="paper"] .jar-name { font-size: .88rem; color: var(--muted); font-weight: 500; font-family: var(--font-body); }
:root[data-skin="paper"] :is(.nudge, .goal-note) { font-size: .74rem; margin-top: 1px; }
:root[data-skin="paper"] .nudge { color: var(--soft-over); }
:root[data-skin="paper"] .goal-note { color: var(--muted); }
:root[data-skin="paper"] .jar.add { min-height: 0; aspect-ratio: 1 / 1.25; max-width: 92px; width: 100%; justify-self: center; border: 2px dashed #D6D1C6; border-radius: 18px; color: #B9B4A9; background: transparent; }
:root[data-skin="paper"] .jar.add span:first-child { font-size: 1.7rem; }
:root[data-skin="paper"] .fab { background: var(--ink); color: #fff; box-shadow: 0 8px 20px rgba(0,0,0,.16); }
/* sheets and drawers on paper too */
:root[data-skin="paper"] :is(.sheet, .drawer) { background: var(--paper) 0 0 / 800px 800px, #FFFEFB; background-blend-mode: multiply; }
:root[data-skin="paper"] .detail-top .eyebrow { display: none; }
:root[data-skin="paper"] .detail-top .big { font-family: var(--num); font-weight: 700; font-size: 2.8rem !important; }
:root[data-skin="paper"] .detail-top .big.over { color: var(--soft-over) !important; }
:root[data-skin="paper"] .kind-note { color: var(--soft-over); font-size: .95rem; }
:root[data-skin="paper"] .detail-top .bar { height: 10px; border-radius: 999px; background: color-mix(in srgb, var(--c) 18%, #fff); }
:root[data-skin="paper"] .detail-top .bar i { background: var(--c); border-radius: 999px; }
:root[data-skin="paper"] .detail-list { border: 0 !important; background: transparent !important; }
:root[data-skin="paper"] .detail-list .row-emoji { display: none; }
:root[data-skin="paper"] .row { border-top: 1px solid var(--line); }
:root[data-skin="paper"] :is(.row-amt, .amt) { font-family: var(--num); font-weight: 700; font-size: 1.1rem; }
:root[data-skin="paper"] .del-link { justify-self: center; color: var(--muted); font-size: .85rem; }
:root[data-skin="paper"] .btn.primary { background: var(--ink); color: #fff; }
:root[data-skin="paper"] input.t.amount { font-family: var(--num); font-weight: 700; font-size: 2.6rem; }
:root[data-skin="paper"] :is(input.t:not(.amount), select.t, .chip, .kind-opt, .theme-opt, .acc) { background: rgba(255,255,255,.72); }
:root[data-skin="paper"] :is(.chip, .fchip, [data-dfilter], [data-filter])[aria-pressed="true"]:not([style*="--c"]) { background: var(--ink) !important; color: #fff !important; border-color: var(--ink) !important; }
:root[data-skin="paper"] :is(.m-card, .wrap-stat, .sticker, .due-item) { background: rgba(255,255,255,.66); }
:root[data-skin="paper"] .m-chart .sp { fill: #8FCFAE; }
:root[data-skin="paper"] .m-chart .sp.over { fill: #F19E9A; }
:root[data-skin="paper"] .m-chart .sp.now { fill: #9DBDF0; }
:root[data-skin="paper"] .wrap-card { background: linear-gradient(150deg, rgba(244,185,138,.28), rgba(195,174,239,.24)), rgba(255,255,255,.5); }
:root[data-skin="paper"] :is(.wrap-stat b, .drawer .row-amt, .m-month b) { font-family: var(--num); }
/* first-run setup and goal jars (all themes) */
.kinds:has(> :nth-child(3)) { grid-template-columns: repeat(3, 1fr); }
.kinds:has(> :nth-child(3)) .kind-opt { padding: 10px; }
.kinds:has(> :nth-child(3)) .kind-opt small { font-size: .72rem; }

<script>
(() => {

  const CURRENCIES = [
    ["USD", "US dollar", "en-US"], ["EUR", "Euro", "en-IE"], ["GBP", "British pound", "en-GB"],
    ["INR", "Indian rupee", "en-IN"], ["CAD", "Canadian dollar", "en-CA"], ["AUD", "Australian dollar", "en-AU"],
    ["NZD", "New Zealand dollar", "en-NZ"], ["SGD", "Singapore dollar", "en-SG"], ["HKD", "Hong Kong dollar", "en-HK"],
    ["AED", "UAE dirham", "en-AE"], ["SAR", "Saudi riyal", "en-SA"], ["JPY", "Japanese yen", "ja-JP"],
    ["CNY", "Chinese yuan", "zh-CN"], ["KRW", "South Korean won", "ko-KR"], ["CHF", "Swiss franc", "de-CH"],
    ["SEK", "Swedish krona", "sv-SE"], ["NOK", "Norwegian krone", "nb-NO"], ["DKK", "Danish krone", "da-DK"],
    ["PLN", "Polish zloty", "pl-PL"], ["MXN", "Mexican peso", "es-MX"], ["BRL", "Brazilian real", "pt-BR"],
    ["ZAR", "South African rand", "en-ZA"], ["PHP", "Philippine peso", "en-PH"], ["MYR", "Malaysian ringgit", "en-MY"],
    ["THB", "Thai baht", "th-TH"], ["IDR", "Indonesian rupiah", "id-ID"], ["NGN", "Nigerian naira", "en-NG"],
    ["PKR", "Pakistani rupee", "en-PK"], ["BDT", "Bangladeshi taka", "en-BD"], ["LKR", "Sri Lankan rupee", "en-LK"],
  ];
  const REMINDERS = [
    "Your jars miss you! Got any spends to tuck in today? 🫙",
    "Psst… did your wallet do anything fun today? Tell your jars 💸",
    "Quick 10-second check-in: log today's spends and rest easy 🌙",
    "Your jars are getting sleepy. One last spend update before bed? 😴",
    "Coffee? Snacks? A tiny treat? Your jars want the gossip ☕",
    "A gentle nudge from your jars: today's spends, please 🥺",
    "You + 10 seconds = a happy budget. Log today's spends ✨",
    "Before dreamland, feed your jars today's spends 🍬",
    "Your future self says thanks for logging today 💛",
    "Jar check! Anything new to add from today? 🫙",
    "Tiny habit, big wins. Log today's spends 🌱",
    "The jars are listening… what did today cost? 👂",
  ];

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const IS_NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  const IN_CLAUDE = !!(window.claude && window.claude.use);
  // The Android app has two native plugins of its own: "Reminders" (notifications) and "JarTools"
  // (files, sharing, Android backup, Play review). This page has no bundler, so we call them through
  // Capacitor's native bridge.
  const plugins = {};
  const nativePlugin = (name) => {
    if (plugins[name] !== undefined) return plugins[name];
    const C = window.Capacitor;
    plugins[name] = null;
    if (IS_NATIVE && C && C.nativePromise && (C.PluginHeaders || []).some((h) => h.name === name))
      plugins[name] = new Proxy({}, { get: (_, method) => (opts) => C.nativePromise(name, String(method), opts || {}) });
    return plugins[name];
  };
  const RM = () => nativePlugin("Reminders");
  const JT = () => nativePlugin("JarTools");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- currency + amounts ---------- */
  let currency = { code: "USD", locale: "en-US", digits: 2, symbol: "$" };
  function setCurrencyCode(code) {
    const c = CURRENCIES.find((x) => x[0] === code) || CURRENCIES[0];
    const f = new Intl.NumberFormat(c[2], { style: "currency", currency: c[0] });
    currency = { code: c[0], locale: c[2], digits: f.resolvedOptions().maximumFractionDigits, symbol: (f.formatToParts(0).find((p) => p.type === "currency") || {}).value || c[0] };
  }
  const money = (n) => {
    const p = 10 ** currency.digits, v = Math.round(n * p) / p;
    return v.toLocaleString(currency.locale, { style: "currency", currency: currency.code, minimumFractionDigits: v % 1 ? currency.digits : 0, maximumFractionDigits: currency.digits });
  };
  // Amount fields accept simple sums like "12+10-3". Each number: up to 7 digits before the decimal and 2 after.
  function cleanAmount(raw) {
    let s = String(raw).replace(/[−–—]/g, "-").replace(/[^0-9.+\-]/g, "");
    s = s.replace(/^[+-]+/, "").replace(/[+-]{2,}/g, (m) => m.slice(-1));
    return s.split(/([+-])/).map((tok) => {
      if (tok === "+" || tok === "-") return tok;
      const [i, ...f] = tok.split(".");
      return f.length ? i.slice(0, 7) + "." + f.join("").slice(0, 2) : i.slice(0, 7);
    }).join("");
  }
  function evalAmount(raw) {
    let s = cleanAmount(raw).replace(/[+-]$/, "");
    if (!s || !/\d/.test(s)) return NaN;
    const parts = s.match(/[+-]?[^+-]+/g) || [];
    let t = 0;
    for (const p of parts) { const v = parseFloat(p); if (!isFinite(v)) return NaN; t += v; }
    return Math.round(t * 100) / 100;
  }
  const hasOps = (s) => /\d[+-]\d?/.test(cleanAmount(s));

  /* ---------- dates ---------- */
  const pad = (n) => String(n).padStart(2, "0");
  const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const curMonth = () => todayStr().slice(0, 7);
  const monthName = (ym) => { const [y, m] = ym.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" }); };
  const shiftMonth = (ym, d) => { const [y, m] = ym.split("-").map(Number); const t = new Date(y, m - 1 + d, 1); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}`; };
  const daysIn = (ym) => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
  const shortDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric" }); };
  const dayLabel = (s) => { if (s === todayStr()) return "Today"; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }); };

  const ordinal = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseDay = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  // Monday of the week a date falls in, as YYYY-MM-DD.
  const weekOf = (s) => { const d = parseDay(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };

  /* ---------- state ---------- */
  const state = { buckets: [], spends: [], recurring: [], months: [], loaded: { buckets: false, spends: false, recurring: false, months: false }, month: curMonth(), readOnly: false };
  const prefs = { theme: "auto", display: "crate", currency: "USD", sound: true, festive: true, reminder: { on: false, time: "21:00" }, mid: true };
  let store = null;
  let sheet = null;
  let drawer = { open: false, filter: "all" };
  let dataReadyResolve; const dataReady = new Promise((r) => (dataReadyResolve = r));

  /* ---------- layers (sheet, drawer, dialog) and Android's back button ---------- */
  // One history entry ("guard") stands in for all open layers, so Android's back button closes the top one.
  // A back() we trigger ourselves is async; until its popstate arrives we don't push a new guard.
  const layers = [];
  let skipPop = 0, guard = false;
  function ensureGuard() { if (IS_NATIVE && layers.length && !guard && !skipPop) { history.pushState({ lj: 1 }, ""); guard = true; } }
  function pushLayer(name) { layers.push(name); ensureGuard(); }
  function popLayer(name) {
    const i = layers.lastIndexOf(name); if (i < 0) return;
    layers.splice(i, 1);
    if (IS_NATIVE && !layers.length && guard) { guard = false; skipPop++; history.back(); }
  }
  window.addEventListener("popstate", () => {
    if (skipPop) { skipPop--; ensureGuard(); return; }
    guard = false;
    const top = layers.pop();
    if (top === "confirm") answerConfirm(false, true);
    else if (top === "drawer") closeDrawer(true);
    else if (top === "months") closeMonths(true);
    else if (top === "sheet") closeSheet(true);
    ensureGuard();
  });
  function closeTop() {
    const top = layers[layers.length - 1];
    if (top === "confirm") answerConfirm(false);
    else if (top === "sheet") closeSheet();
    else if (top === "drawer") closeDrawer();
    else if (top === "months") closeMonths();
  }

  /* ---------- storage ---------- */
  function dbStore(db) {
    return {
      subscribe(col, cb) {
        db.collection(col).onSnapshot(
          (s) => cb(s.docs.map((d) => ({ id: d.id, ...d.data() }))),
          (e) => toast(e && e.code === "revoked" ? "This budget is no longer available here." : "Lost connection to your saved budget. Reload to reconnect.")
        );
      },
      add: (col, data) => db.collection(col).add(data),
      put: (col, id, data) => db.doc(`${col}/${id}`).set(data),
      update: (col, id, data) => db.doc(`${col}/${id}`).update(data),
      remove: (col, id) => db.doc(`${col}/${id}`).delete(),
      watchPrefs: (cb) => db.doc("settings/main").onSnapshot((s) => { if (s.exists) cb(s.data()); }, () => {}),
      savePrefs: (d) => db.doc("settings/main").set(d),
    };
  }
  const LOCAL_KEY = "budget-jars-v1";
  // Every saved change is stamped (_u: when, _by: which phone) and a delete leaves a marker in
  // _deleted, so partner sync can tell what changed on each phone since they last met.
  const deviceId = () => { let d = lsGet("lj-device"); if (!d) { d = Date.now().toString(36) + Math.random().toString(36).slice(2, 10); lsSet("lj-device", d); } return d; };
  function localStore() {
    let data = {};
    try { const raw = localStorage.getItem(LOCAL_KEY); if (raw) data = JSON.parse(raw) || {}; } catch {}
    const subs = {};
    const emit = (col) => { lsSet(LOCAL_KEY, JSON.stringify(data)); mirrorSoon(); partnerDirty(); (subs[col] || []).forEach((cb) => cb(Object.entries(data[col] || {}).map(([id, v]) => ({ id, ...v })))); };
    const id = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const col = (c) => (data[c] = data[c] || {});
    const stamp = (c, v) => {
      const out = { ...v, _u: Date.now(), _by: deviceId() };
      if (c === "spends" && !out.who && partnerInfo()) out.who = myName();
      return out;
    };
    const unmark = (c, i) => { if (data._deleted && data._deleted[c]) delete data._deleted[c][i]; };
    return {
      subscribe(c, cb) { col(c); (subs[c] = subs[c] || []).push(cb); setTimeout(() => emit(c)); },
      async add(c, v) { col(c)[id()] = stamp(c, v); emit(c); },
      async put(c, i, v) { unmark(c, i); col(c)[i] = stamp(c, v); emit(c); },
      async update(c, i, v) { col(c)[i] = stamp(c, { ...col(c)[i], ...v }); emit(c); },
      async remove(c, i) { delete col(c)[i]; data._deleted = data._deleted || {}; (data._deleted[c] = data._deleted[c] || {})[i] = Date.now(); emit(c); },
      raw: () => JSON.parse(JSON.stringify(data)),
      replaceAll(next) { data = next; Object.keys(subs).forEach((c) => { col(c); emit(c); }); },
    };
  }
  // Android app: keep a copy of everything in a plain file that Android's own backup carries to a new
  // phone (Google's encrypted backup and phone-to-phone transfer). Nothing goes to us.
  const localKeys = () => { const o = {}; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (/^(lj-|budget-jars-)/.test(k)) o[k] = localStorage.getItem(k); } } catch {} return o; };
  let mirrorTimer;
  function mirrorSoon() {
    if (!JT()) return;
    clearTimeout(mirrorTimer);
    mirrorTimer = setTimeout(() => { JT().mirrorSave({ data: JSON.stringify({ app: "little-jars", savedAt: Date.now(), keys: localKeys() }) }).catch(() => {}); }, 1500);
  }
  // On a fresh install (nothing saved yet), bring back the copy Android restored, if there is one.
  async function restoreMirror() {
    if (!JT() || lsGet(LOCAL_KEY)) return false;
    try {
      const r = await JT().mirrorLoad();
      const m = r && r.data && JSON.parse(r.data);
      if (!m || m.app !== "little-jars" || !m.keys || !m.keys[LOCAL_KEY]) return false;
      Object.entries(m.keys).forEach(([k, v]) => lsSet(k, v));
      return true;
    } catch { return false; }
  }
  async function write(fn, okMsg) {
    try { await fn(); if (okMsg) toast(okMsg); return true; }
    catch (e) {
      if (e && e.code === "invalid_argument") { state.readOnly = true; toast("You can view this budget but not change it."); }
      else if (e && e.code === "quota_exceeded") toast("Storage is full. Delete some old spends and try again.");
      else toast("Couldn't save that. Check your connection and try again.");
      return false;
    }
  }

  /* ---------- preferences ---------- */
  function loadLocalPrefs() {
    prefs.theme = lsGet("budget-jars-theme") || "auto";

    prefs.currency = lsGet("budget-jars-currency") || "USD";

    try { const r = JSON.parse(lsGet("lj-reminder") || "null"); if (r && typeof r.on === "boolean") prefs.reminder = { on: r.on, time: r.time || "21:00" }; } catch {}
    prefs.festive = lsGet("lj-festive") !== "off";
    prefs.display = lsGet("lj-display") === "shelf" ? "shelf" : "crate";
    prefs.mid = lsGet("lj-mid") !== "off";
    setCurrencyCode(prefs.currency);

  function savePrefs() {
    lsSet("budget-jars-theme", prefs.theme);
    lsSet("budget-jars-currency", prefs.currency);
    lsSet("lj-sound", prefs.sound ? "on" : "off");
    lsSet("lj-festive", prefs.festive ? "on" : "off");

      if (audio.state === "suspended") audio.resume();
      const t0 = audio.currentTime;
      // "cha": a short bright noise burst, like a register drawer
      const len = Math.floor(audio.sampleRate * 0.07), buf = audio.createBuffer(1, len, audio.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const noise = audio.createBufferSource(); noise.buffer = buf;
      const hp = audio.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 3000;
      const ng = audio.createGain(); ng.gain.value = 0.25;
      noise.connect(hp).connect(ng).connect(audio.destination); noise.start(t0);
      // "ching": two quick bell tones with a ringing tail
      [[0.08, [2093, 3136, 4186]], [0.2, [2637, 3951, 5274]]].forEach(([dt, freqs]) => {
        freqs.forEach((f, k) => {
          const o = audio.createOscillator(), g = audio.createGain();
          o.type = "sine"; o.frequency.value = f;
          const start = t0 + dt, peak = 0.16 / (k + 1);

  }

  /* ---------- reminders (Android app only) ---------- */
  // The reminder fires every day at the chosen time, whether or not you've logged anything that day.
  // The mid-month check-in (the 15th, late morning) carries a line about this month, refreshed whenever
  // the jars change. If the app hasn't been opened this month, Android shows a generic line instead.
  function midText() {
    const m = curMonth(), jars = state.buckets.filter((b) => !isSave(b));
    const limit = jars.reduce((a, b) => a + effLimit(b, m), 0), spent = jars.reduce((a, b) => a + spentIn(b.id, m), 0);
    if (!(limit > 0)) return "";
    const pct = Math.round(spent / limit * 100);
    return pct <= 50 ? `Halfway through the month and you've used ${pct}% of your budget. Nicely done! 🌗`
      : pct <= 100 ? `Halfway through the month: ${pct}% of your budget is used. A quick peek at your jars? 🌗`
      : `Halfway through the month and your jars are over budget. Peek in and plan the rest 🌗`;
  }
  async function syncReminder() {
    const rm = RM(); if (!rm) return;
    const [hour, minute] = prefs.reminder.time.split(":").map(Number);

  }

    if (sheet && sheet.kind === "settings") renderSheet();

      const st = await rm.requestNotifications();

        prefs.reminder.on = false; savePrefs(); await syncReminder();
        toast("Notifications are off for Little Jars. Turn them on in your phone's settings.");
        if (sheet && sheet.kind === "settings") renderSheet();

      if (!st.exact) await rm.openExactSettings();
