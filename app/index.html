<style>
/*FONTS-START*/
@font-face { font-family: "Fredoka"; font-weight: 500; font-style: normal; font-display: swap; src: url("fonts/fredoka-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Fredoka"; font-weight: 600; font-style: normal; font-display: swap; src: url("fonts/fredoka-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Fredoka"; font-weight: 700; font-style: normal; font-display: swap; src: url("fonts/fredoka-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/figtree-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 500; font-style: normal; font-display: swap; src: url("fonts/figtree-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 600; font-style: normal; font-display: swap; src: url("fonts/figtree-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 700; font-style: normal; font-display: swap; src: url("fonts/figtree-latin-700-normal.woff2") format("woff2"); }
html { color-scheme: light; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/*FONTS-END*/

/* Layout: a box of jars (the month's total) on top, free-standing jars below, expenses in a drawer behind a paper-clip tab, a floating Add button, and bottom sheets for input. */
:root {
  --bg: #EEF3F1;
  --surface: #FFFFFF;
  --ink: #14221D;
  --muted: #5B6C66;
  --line: #D8E2DE;
  --accent: #2F5BEA;
  --accent-ink: #FFFFFF;
  --danger: #D33A41;
  --good: #1D8A57;
  --scrim: rgba(12, 22, 18, .42);
  --shadow: 0 1px 2px rgba(20, 34, 29, .06), 0 6px 20px rgba(20, 34, 29, .06);

  --j0: #2FA36B; --j1: #F08A2B; --j2: #E4508A; --j3: #3A86F0;
  --j4: #8B5CF6; --j5: #D6A400; --j6: #13A0A0; --j7: #E5484D;

  --font-display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
}
/* "Auto" theme: follow the system, or the claude.ai viewer's own light/dark switch. */
@media (prefers-color-scheme: dark) {
  :root:not([data-skin]):not([data-theme="light"]) {
    --bg: #0E1412; --surface: #17201C; --ink: #E8F0EC; --muted: #93A49D; --line: #2A3631;
    --accent: #7F9BFF; --accent-ink: #0E1412; --danger: #FF6B70; --good: #4CC38A;
    --scrim: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-skin]) {
  --bg: #0E1412; --surface: #17201C; --ink: #E8F0EC; --muted: #93A49D; --line: #2A3631;
  --accent: #7F9BFF; --accent-ink: #0E1412; --danger: #FF6B70; --good: #4CC38A;
  --scrim: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
:root[data-skin="midnight"] {
  --bg: #000000; --surface: #121214; --ink: #F4F4F5; --muted: #9B9BA4; --line: #26262B;
  --accent: #A78BFA; --accent-ink: #0B0B0D; --danger: #FF6B70; --good: #4ADE80;
  --scrim: rgba(0, 0, 0, .72); --shadow: 0 0 0 1px #1E1E22;
  --j0: #34D399; --j1: #FB923C; --j2: #F472B6; --j3: #60A5FA;
  --j4: #A78BFA; --j5: #FACC15; --j6: #2DD4BF; --j7: #F87171;
  color-scheme: dark;
}
:root[data-skin="sunny"] {
  --bg: #FFFFFF; --surface: #FFFFFF; --ink: #1B1530; --muted: #6B6585; --line: #EEEAF6;
  --accent: #FF4F8B; --accent-ink: #FFFFFF; --danger: #E5383B; --good: #16A34A;
  --scrim: rgba(27, 21, 48, .35); --shadow: 0 2px 4px rgba(255, 79, 139, .06), 0 10px 28px rgba(80, 60, 160, .10);
  --j0: #22C55E; --j1: #FF8A00; --j2: #FF3D7F; --j3: #2D9CFF;
  --j4: #9B5CFF; --j5: #FFC400; --j6: #00C2B8; --j7: #FF4D4D;
  color-scheme: light;
}
:root[data-skin="holiday"] {
  --bg: #0F2A1F; --surface: #163A2B; --ink: #FFF7E8; --muted: #BFD3C5; --line: #24513C;
  --accent: #E23B4E; --accent-ink: #FFFFFF; --danger: #FF7A85; --good: #7EE2A8;
  --scrim: rgba(5, 15, 10, .6); --shadow: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.25);
  --j0: #5FD39A; --j1: #F2C14E; --j2: #FF8FA3; --j3: #8FD3FF;
  --j4: #B48CFF; --j5: #E9E4D4; --j6: #FF9F6B; --j7: #E23B4E;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  position: relative; z-index: 1;
  max-width: 1040px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 120px;
  display: flex; flex-direction: column; gap: 22px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, .jar:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-size: 1.5rem; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 32px; height: 32px; border-radius: 9px; display: block; }
:root[data-skin="holiday"] .brand::after { content: "🎄"; font-size: 1.2rem; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.month { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.month button { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 999px; font-size: 1.1rem; }
.month button:hover:not(:disabled) { background: var(--bg); }
.month button:disabled { opacity: .3; cursor: default; }
.month-label { min-width: 130px; text-align: center; font-weight: 600; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); width: 46px; height: 46px; border-radius: 999px; font-size: 1.25rem; display: grid; place-items: center; }

/* Summary: a box of new mason jars seen from the top, one lid per jar, with a taped-on label. */
.summary { display: grid; gap: 10px; }
.eyebrow { font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.big { font-family: var(--font-display); font-size: clamp(2.2rem, 7vw, 3.2rem); font-weight: 600; line-height: 1.05; }
.jarbox {
  --box: #C9965B; --box-wall: #B8864E; --box-flap: #D3A469; --box-inside: #5E3F22; --box-print: #8A5F33;
  position: relative; width: 100%; max-width: 440px; margin: 0 auto;
}
:root[data-skin="holiday"] .jarbox { --box: #B3202F; --box-wall: #8E1B2A; --box-flap: #C42A3A; --box-inside: #4A0E18; --box-print: #F2C14E; }
.jarbox svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 10px 14px rgba(0,0,0,.16)); overflow: visible; }
.jarbox .b-flap { fill: var(--box-flap); }
.jarbox .b-crease { stroke: var(--box-wall); stroke-width: 1.5; }
.jarbox .b-wall { fill: var(--box-wall); }
.jarbox .b-inside { fill: var(--box-inside); }
.jarbox .b-ribbon { fill: #F2C14E; display: none; }
:root[data-skin="holiday"] .jarbox .b-ribbon { display: inline; }
.jarbox .b-print { fill: var(--box-print); font-family: var(--font-display); font-weight: 700; }
.lid-g { cursor: pointer; }
.lid-g .l-glass { fill: rgba(255, 255, 255, .28); stroke: rgba(255, 255, 255, .5); stroke-width: 1; }
.lid-g .l-rim { fill: color-mix(in srgb, var(--c) 62%, #000); }
.lid-g .l-top { fill: var(--c); }
.lid-g .l-ring { fill: none; stroke: rgba(255, 255, 255, .35); stroke-width: 1.2; }
.lid-g .l-name { fill: #FFFFFF; font-family: var(--font-display); font-weight: 700; text-anchor: middle; paint-order: stroke; stroke: rgba(0, 0, 0, .28); stroke-width: 2px; }
.lid-g.over .l-rim { fill: var(--danger); }
.box-sticker {
  position: relative; margin: -34px auto 0; width: fit-content; min-width: 190px; max-width: 86%;
  background: #FFF8EC; color: #2A1E12; border-radius: 10px; padding: 8px 18px 10px; text-align: center;
  transform: rotate(-2deg); box-shadow: 0 6px 14px rgba(0,0,0,.18);
}
.box-sticker::before { content: ""; position: absolute; top: -9px; left: 50%; width: 64px; height: 18px; transform: translateX(-50%) rotate(3deg); background: rgba(255,255,255,.6); border: 1px solid rgba(0,0,0,.06); }
.summary .box-sticker .eyebrow { color: #7A6650; font-size: .66rem; }
.box-sticker .big { color: #2A1E12; font-size: clamp(1.5rem, 7vw, 2.2rem); }
.box-sticker.over .big, .summary .box-sticker.over .eyebrow { color: #D33A41; }
.sum-line { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; color: var(--muted); font-size: .92rem; }
.sum-line b { color: var(--ink); }
.stack { max-width: 440px; width: 100%; margin: 0 auto; height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; display: flex; }
.stack i { display: block; height: 100%; }
.pace { color: var(--muted); font-size: .9rem; text-align: center; }

/* Jars */
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-head h2 { font-size: 1.25rem; }
.hint { color: var(--muted); font-size: .8rem; font-weight: 500; }
.link-btn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 6px 2px; }
.jars { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 14px; }
.jar {
  --c: var(--j0);
  position: relative; border: 0; background: none; padding: 0;
  display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  transition: transform .15s ease, opacity .15s ease;
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
}
.jar:hover { transform: translateY(-3px); }
.jar:active { transform: scale(.97); }
.jar:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 18px; }
.jar.drag-src { opacity: .25; }
.drag-ghost { position: fixed; z-index: 90; pointer-events: none; transform: translate(-50%, -55%) scale(1.06) rotate(-3deg); filter: drop-shadow(0 16px 20px rgba(0,0,0,.28)); }
.jar-art { position: relative; width: 100%; max-width: 168px; }
.jar-art svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 6px 10px rgba(0,0,0,.10)); }
.jar-art .glass { fill: color-mix(in srgb, var(--c) 8%, var(--surface)); }
.jar-art .glass-edge { fill: none; stroke: color-mix(in srgb, var(--c) 45%, var(--line)); stroke-width: 2.5; }
.jar.over .jar-art .glass-edge { stroke: var(--danger); stroke-width: 3; }
.jar-art .lid { fill: color-mix(in srgb, var(--c) 55%, var(--ink)); }
.jar-art .neck { fill: color-mix(in srgb, var(--c) 30%, var(--surface)); }
.jar-art .shine { fill: #FFFFFF; opacity: .45; }
.jar-art .liquid { transition: transform 1.2s cubic-bezier(.25, .9, .3, 1.15); }
.jar-art .wave { fill: var(--c); }
.jar-art .wave.back { opacity: .45; animation: slosh 5.5s linear infinite reverse; }
.jar-art .wave.front { opacity: .9; animation: slosh 3.2s linear infinite; }
@keyframes slosh { to { transform: translateX(50px); } }
.jar-art .jar-emoji { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); font-size: 2.1rem; line-height: 1; filter: drop-shadow(0 1px 1px rgba(0,0,0,.2)); }
.jar-label {
  position: absolute; left: 50%; top: 72%; transform: translate(-50%, -50%);
  background: color-mix(in srgb, var(--surface) 92%, transparent); color: var(--ink);
  border-radius: 10px; padding: 3px 10px 4px; box-shadow: 0 1px 3px rgba(0,0,0,.15);
  font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; line-height: 1.1; white-space: nowrap;
  max-width: 66%; overflow: hidden; text-overflow: ellipsis;
}
.jar-label small { display: block; font-family: var(--font-body); font-weight: 600; font-size: .62rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.jar.over .jar-label { color: var(--danger); }
.jar-name { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jar-sub { color: var(--muted); font-size: .82rem; margin-top: -4px; }
.pill { position: absolute; top: 4px; right: 6px; z-index: 1; font-size: .66rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 7px; border-radius: 999px; background: var(--bg); color: var(--muted); }
.pill.warn { background: color-mix(in srgb, var(--j5) 30%, var(--surface)); color: var(--ink); }
.pill.bad { background: var(--danger); color: var(--surface); }
.jar.add { justify-content: center; color: var(--muted); font-weight: 600; border: 2px dashed var(--line); border-radius: 22px; min-height: 200px; }
.jar.add span:first-child { font-size: 2rem; line-height: 1; }

/* Rows (expenses) */
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row-emoji { width: 38px; height: 38px; flex: none; border-radius: 12px; display: grid; place-items: center; font-size: 1.25rem; background: color-mix(in srgb, var(--c, var(--j0)) 20%, transparent); }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-meta { color: var(--muted); font-size: .84rem; }
.row-amt { font-weight: 700; }
.row-del { border: 0; background: none; color: var(--muted); width: 34px; height: 34px; border-radius: 10px; font-size: 1.1rem; flex: none; }
.row-del:hover { background: var(--bg); color: var(--danger); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.notice { font-size: .85rem; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; }
.foot { text-align: center; color: var(--muted); font-size: .82rem; margin: 0; }
.foot a { color: inherit; }

/* FAB */
.fab {
  position: fixed; z-index: 20;
  right: max(20px, calc(env(safe-area-inset-right, 0px) + 20px));
  bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 16px));
  border: 0; border-radius: 999px; padding: 16px 24px 16px 20px;
  background: var(--accent); color: var(--accent-ink);
  font-family: var(--font-display); font-weight: 600; font-size: 1.1rem;
  box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 45%, transparent);
  display: flex; align-items: center; gap: 8px;
}
.fab b { font-size: 1.5rem; line-height: 1; font-weight: 500; }
/* Leave room on narrow screens for the paper-clip tab on the right edge. */
@media (max-width: 640px) { .wrap { padding-right: max(44px, env(safe-area-inset-right, 0px)); } }

/* Expenses drawer, opened by a paper-clipped tab on the right edge. */
.clip-tab {
  position: fixed; z-index: 25; right: 0; top: 46%;
  border: 1px solid var(--line); border-right: 0; background: var(--surface); color: var(--ink);
  border-radius: 14px 0 0 14px; padding: 18px 8px 12px 9px;
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  box-shadow: -4px 4px 14px rgba(0,0,0,.14);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.clip-tab svg { position: absolute; top: -18px; left: 50%; width: 18px; height: 40px; transform: translateX(-50%) rotate(8deg); }
.clip-tab span { writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--font-display); font-weight: 600; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
.clip-tab b { font-size: .7rem; min-width: 20px; padding: 1px 5px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
.drawer-scrim { position: fixed; inset: 0; z-index: 44; background: var(--scrim); }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 45; width: min(420px, 92vw);
  background: var(--surface); color: var(--ink); box-shadow: -20px 0 50px rgba(0,0,0,.25);
  transform: translateX(105%); transition: transform .28s cubic-bezier(.3,.8,.3,1), visibility 0s .28s;
  display: flex; flex-direction: column; visibility: hidden;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.drawer.open { transform: none; visibility: visible; transition: transform .28s cubic-bezier(.3,.8,.3,1), visibility 0s; }
.drawer-head { padding: 18px 18px 12px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.drawer-head .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.drawer-head .chip { flex: none; padding: 6px 12px; font-size: .88rem; }
.drawer-list { overflow: auto; flex: 1; }
.day-head { position: sticky; top: 0; background: var(--surface); padding: 10px 16px 4px; font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }

/* Sheets */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 20px; }
.sheet {
  background: var(--surface); color: var(--ink); width: 100%; max-width: 480px; max-height: 88vh; overflow: auto;
  border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
.sheet.anim { animation: rise .22s ease-out; }
@keyframes rise { from { transform: translateY(16px); opacity: .6; } }
@media (max-width: 560px) {
  .scrim { align-items: flex-end; padding: 0; }
  .sheet { max-width: none; border-radius: 24px 24px 0 0; padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h3 { font-size: 1.35rem; }
.x { border: 0; background: var(--bg); width: 36px; height: 36px; border-radius: 999px; font-size: 1.1rem; flex: none; }
label.f, .f { display: grid; gap: 6px; font-weight: 600; font-size: .9rem; }
input.t, select.t, textarea.t {
  font: inherit; color: var(--ink); background: var(--bg); border: 2px solid transparent; border-radius: 14px;
  padding: 12px 14px; width: 100%; font-weight: 500;
}
textarea.t { min-height: 120px; resize: vertical; }
input.t:focus, select.t:focus, textarea.t:focus { border-color: var(--accent); outline: none; }
select.t { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px; }
.amount-wrap { position: relative; }
.amount-wrap > span { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-family: var(--font-display); font-size: 2rem; color: var(--muted); pointer-events: none; }
input.amount { font-family: var(--font-display); font-size: 2.4rem; font-weight: 600; }
.ops { display: flex; gap: 8px; align-items: center; }
.ops button { border: 0; background: var(--bg); border-radius: 12px; min-width: 52px; padding: 8px 14px; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; }
.calc { color: var(--muted); font-weight: 600; font-size: .95rem; margin-left: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px;
  font-weight: 600; display: flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"] { border-color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 16%, var(--surface)); }
.emojis { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
.emojis button { border: 2px solid transparent; background: var(--bg); border-radius: 12px; height: 42px; font-size: 1.3rem; }
.emojis button[aria-pressed="true"] { border-color: var(--accent); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatches button { width: 34px; height: 34px; border-radius: 999px; border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--line); }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .two { grid-template-columns: 1fr; } }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 14px; padding: 13px 18px; font-weight: 700; background: var(--bg); }
.btn.primary { background: var(--accent); color: var(--accent-ink); flex: 1; }
.btn.danger { background: transparent; color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: var(--surface); }
.err { color: var(--danger); font-size: .88rem; font-weight: 600; }
.detail-top { display: grid; gap: 8px; }
.bar { height: 12px; border-radius: 999px; background: var(--bg); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c); border-radius: 999px; }
.detail-list { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.detail-list .row { padding: 10px 12px; }
.confirm { background: color-mix(in srgb, var(--danger) 10%, var(--surface)); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; }
.themes { display: grid; gap: 10px; }
.theme-opt {
  display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
  border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: 12px 14px;
}
.theme-opt[aria-pressed="true"] { border-color: var(--accent); }
.theme-opt b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
.theme-opt span { color: var(--muted); font-size: .88rem; }
.swatch { display: flex; flex: none; }
.swatch i { width: 26px; height: 26px; border-radius: 999px; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.swatch i + i { margin-left: -8px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--bg); border-radius: 14px; font-weight: 600; }
.set-row small { display: block; color: var(--muted); font-weight: 500; font-size: .82rem; }
.set-row input[type="time"] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(20px); }
.switch input:focus-visible + i { outline: 3px solid var(--accent); outline-offset: 2px; }
.links { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.version { color: var(--muted); font-size: .8rem; text-align: center; }
.news { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.news li { display: flex; gap: 12px; align-items: flex-start; background: var(--bg); border-radius: 14px; padding: 10px 12px; }
.news li span { font-size: 1.4rem; line-height: 1.2; }
.copy-box { display: flex; gap: 8px; align-items: center; background: var(--bg); border-radius: 12px; padding: 8px 8px 8px 12px; font-weight: 600; }
.copy-box code { flex: 1; font: inherit; user-select: all; overflow-wrap: anywhere; }

/* Confirm dialog */
.confirm-scrim { z-index: 70; align-items: center !important; padding: 16px !important; }
.dialog { background: var(--surface); color: var(--ink); border-radius: 22px; padding: 22px; width: min(380px, calc(100vw - 32px)); display: grid; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.3); animation: pop .18s ease-out; }
.dialog h3 { font-size: 1.25rem; }
.dialog p { margin: 0; color: var(--muted); }
.dialog .actions .btn { flex: 1; }
@keyframes pop { from { transform: scale(.94); opacity: .5; } }

.toast {
  position: fixed; z-index: 75; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600;
  box-shadow: var(--shadow); max-width: calc(100% - 32px);
}

/* First-run tour: spotlight, bouncing arrow, and a label bubble. */
.tour { position: fixed; inset: 0; z-index: 80; }
.tour-spot { position: fixed; border-radius: 18px; box-shadow: 0 0 0 9999px rgba(8, 12, 22, .66); transition: all .3s ease; pointer-events: none; }
.tour-bubble { position: fixed; width: min(320px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); border-radius: 18px; padding: 16px 16px 14px; box-shadow: 0 14px 40px rgba(0,0,0,.35); display: grid; gap: 8px; }
.tour-bubble b { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; }
.tour-bubble p { margin: 0; color: var(--muted); }
.tour-bubble .actions { align-items: center; }
.tour-step { color: var(--muted); font-size: .8rem; font-weight: 600; margin-right: auto; }
.tour-arrow { position: fixed; width: 44px; height: 44px; margin-left: -22px; color: #FFD34D; filter: drop-shadow(0 2px 4px rgba(0,0,0,.45)); }
.tour-arrow.down { animation: bobDown .6s ease-in-out infinite alternate; }
.tour-arrow.up { animation: bobUp .6s ease-in-out infinite alternate; }
.tour-arrow.up svg { transform: rotate(180deg); }
@keyframes bobDown { to { transform: translateY(10px); } }
@keyframes bobUp { to { transform: translateY(-10px); } }

/* Startup animation: two coins drop into the jar, it fills, and the name appears. */
#intro { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, #4C74FF, #2F5BEA 55%, #2448C4); transition: opacity .35s ease; cursor: pointer; }
#intro.out { opacity: 0; }
.intro-stage { display: grid; justify-items: center; gap: 6px; }
.intro-jar { width: 150px; height: auto; overflow: visible; }
.intro-coin { animation: coinDrop .6s cubic-bezier(.55, 0, .8, .2) both; }
.intro-coin.c2 { animation-delay: .32s; }
@keyframes coinDrop { 0% { transform: translateY(-260px) rotate(-40deg); opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(0) rotate(0); opacity: 0; } }
.intro-liquid { animation: fillUp .75s .6s cubic-bezier(.3, .8, .3, 1.1) both; }
@keyframes fillUp { from { transform: translateY(96px); } }
.intro-lid { animation: lidOn .35s 1.15s cubic-bezier(.3, .8, .3, 1.2) both; }
@keyframes lidOn { from { transform: translate(-46px, -26px) rotate(-28deg); } }
.intro-word { font-family: var(--font-display); font-weight: 700; font-size: 2.6rem; color: #FFFFFF; animation: wordIn .45s 1.05s both; }
.intro-tag { font-weight: 500; color: rgba(255, 255, 255, .88); animation: wordIn .45s 1.2s both; }
@keyframes wordIn { from { opacity: 0; transform: translateY(10px); } }

/* Holiday snow */
#snow { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
#snow i { position: absolute; top: -12px; border-radius: 50%; background: #FFFFFF; opacity: .55; animation: snow linear infinite; }
@keyframes snow { to { transform: translate3d(var(--drift, 20px), 105vh, 0); } }

@media (prefers-reduced-motion: reduce) {
  .jar-art .wave, #snow, .tour-arrow { animation: none !important; }
  .jar-art .liquid, .drawer, .jar { transition: none; }
  .sheet.anim, .dialog { animation: none; }
  #snow { display: none; }
}
</style>

      <g class="intro-coin c2"><circle cx="118" cy="114" r="16" fill="#F7C548" stroke="#E0A526" stroke-width="3"/><text x="118" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#8A5300" font-family="system-ui, sans-serif">₹</text></g>

<script>
(() => {
  const APP_VERSION = "1.1.0";
  const SUPPORT_EMAIL = "littlejarsapp@gmail.com";
  const MAX_AMOUNT = 9999999.99;
  const EMOJIS = ["🛒","🍜","🍕","☕","⛽","🚗","🏠","💡","🛍️","👗","🎉","🎬","🎮","✈️","🐾","💊","🏋️","📚","🎁","👶","💇","📱","🍷","🌱",
                  "📈","💹","🏦","💰","🪙","💵","🐷","💳","🎓","🧾","🏖️","❤️"];
  const PRESETS = [["Groceries","🛒"],["Eating out","🍜"],["Coffee","☕"],["Gas","⛽"],["Shopping","🛍️"],["Fun","🎉"],["Home","🏠"],["Pets","🐾"],["Investing","📈"],["Savings","🐷"]];
  const FILLS = [["liquid","Liquid","💧"],["candy","Candy","🍬"],["kisses","Chocolate kisses","🍫"],["cash","Cash","💵"],["coins","Coins","🪙"]];
  const COLORS = 8;
  const THEMES = [
    { id: "auto", name: "Auto", desc: "Follows your phone's light or dark mode", sw: ["#EEF3F1", "#2F5BEA", "#0E1412"] },
    { id: "sunny", name: "Sunny", desc: "Bright white with candy colors", sw: ["#FFFFFF", "#FF4F8B", "#FFC400"] },
    { id: "midnight", name: "Midnight", desc: "True black, easy on the eyes at night", sw: ["#000000", "#A78BFA", "#34D399"] },
    { id: "holiday", name: "Holiday", desc: "Evergreen, cranberry and gold, with snow", sw: ["#0F2A1F", "#E23B4E", "#F2C14E"] },
  ];
  const CURRENCIES = [
    ["USD", "US dollar", "en-US"], ["EUR", "Euro", "en-IE"], ["GBP", "British pound", "en-GB"],
    ["INR", "Indian rupee", "en-IN"], ["CAD", "Canadian dollar", "en-CA"], ["AUD", "Australian dollar", "en-AU"],
    ["NZD", "New Zealand dollar", "en-NZ"], ["SGD", "Singapore dollar", "en-SG"], ["HKD", "Hong Kong dollar", "en-HK"],
    ["AED", "UAE dirham", "en-AE"], ["SAR", "Saudi riyal", "en-SA"], ["JPY", "Japanese yen", "ja-JP"],
    ["CNY", "Chinese yuan", "zh-CN"], ["KRW", "South Korean won", "ko-KR"], ["CHF", "Swiss franc", "de-CH"],
    ["SEK", "Swedish krona", "sv-SE"], ["NOK", "Norwegian krone", "nb-NO"], ["DKK", "Danish krone", "da-DK"],
    ["PLN", "Polish zloty", "pl-PL"], ["MXN", "Mexican peso", "es-MX"], ["BRL", "Brazilian real", "pt-BR"],
    ["ZAR", "South African rand", "en-ZA"], ["PHP", "Philippine peso", "en-PH"], ["MYR", "Malaysian ringgit", "en-MY"],
    ["THB", "Thai baht", "th-TH"], ["IDR", "Indonesian rupiah", "id-ID"], ["NGN", "Nigerian naira", "en-NG"],
    ["PKR", "Pakistani rupee", "en-PK"], ["BDT", "Bangladeshi taka", "en-BD"], ["LKR", "Sri Lankan rupee", "en-LK"],
  ];
  const REMINDERS = [
    "Your jars miss you! Got any spends to tuck in today? 🫙",
    "Psst… did your wallet do anything fun today? Tell your jars 💸",
    "Quick 10-second check-in: log today's spends and rest easy 🌙",
    "Your jars are getting sleepy. One last spend update before bed? 😴",
    "Coffee? Snacks? A tiny treat? Your jars want the gossip ☕",
    "A gentle nudge from your jars: today's spends, please 🥺",
    "You + 10 seconds = a happy budget. Log today's spends ✨",
    "Before dreamland, feed your jars today's spends 🍬",
    "Your future self says thanks for logging today 💛",
    "Jar check! Anything new to add from today? 🫙",
    "Tiny habit, big wins. Log today's spends 🌱",
    "The jars are listening… what did today cost? 👂",
  ];

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const IS_NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  const IN_CLAUDE = !!(window.claude && window.claude.use);
  // Daily reminders live in the app's own native "Reminders" plugin (Android only). This page has no
  // bundler, so we call it through Capacitor's native bridge.
  let rmPlugin;
  const RM = () => {
    if (rmPlugin !== undefined) return rmPlugin;
    const C = window.Capacitor;
    rmPlugin = null;
    if (IS_NATIVE && C && C.nativePromise && (C.PluginHeaders || []).some((h) => h.name === "Reminders"))
      rmPlugin = new Proxy({}, { get: (_, method) => (opts) => C.nativePromise("Reminders", String(method), opts || {}) });
    return rmPlugin;
  };
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- currency + amounts ---------- */
  let currency = { code: "USD", locale: "en-US", digits: 2, symbol: "$" };
  function setCurrencyCode(code) {
    const c = CURRENCIES.find((x) => x[0] === code) || CURRENCIES[0];
    const f = new Intl.NumberFormat(c[2], { style: "currency", currency: c[0] });
    currency = { code: c[0], locale: c[2], digits: f.resolvedOptions().maximumFractionDigits, symbol: (f.formatToParts(0).find((p) => p.type === "currency") || {}).value || c[0] };
  }
  const money = (n) => {
    const p = 10 ** currency.digits, v = Math.round(n * p) / p;
    return v.toLocaleString(currency.locale, { style: "currency", currency: currency.code, minimumFractionDigits: v % 1 ? currency.digits : 0, maximumFractionDigits: currency.digits });
  };
  // Amount fields accept simple sums like "12+10-3". Each number: up to 7 digits before the decimal and 2 after.
  function cleanAmount(raw) {
    let s = String(raw).replace(/[−–—]/g, "-").replace(/[^0-9.+\-]/g, "");
    s = s.replace(/^[+-]+/, "").replace(/[+-]{2,}/g, (m) => m.slice(-1));
    return s.split(/([+-])/).map((tok) => {
      if (tok === "+" || tok === "-") return tok;
      const [i, ...f] = tok.split(".");
      return f.length ? i.slice(0, 7) + "." + f.join("").slice(0, 2) : i.slice(0, 7);
    }).join("");
  }
  function evalAmount(raw) {
    let s = cleanAmount(raw).replace(/[+-]$/, "");
    if (!s || !/\d/.test(s)) return NaN;
    const parts = s.match(/[+-]?[^+-]+/g) || [];
    let t = 0;
    for (const p of parts) { const v = parseFloat(p); if (!isFinite(v)) return NaN; t += v; }
    return Math.round(t * 100) / 100;
  }
  const hasOps = (s) => /\d[+-]\d?/.test(cleanAmount(s));

  /* ---------- dates ---------- */
  const pad = (n) => String(n).padStart(2, "0");
  const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const curMonth = () => todayStr().slice(0, 7);
  const monthName = (ym) => { const [y, m] = ym.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" }); };
  const shiftMonth = (ym, d) => { const [y, m] = ym.split("-").map(Number); const t = new Date(y, m - 1 + d, 1); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}`; };
  const daysIn = (ym) => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
  const shortDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric" }); };
  const dayLabel = (s) => { if (s === todayStr()) return "Today"; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }); };

  /* ---------- state ---------- */
  const state = { buckets: [], spends: [], loaded: { buckets: false, spends: false }, month: curMonth(), readOnly: false };
  const prefs = { theme: "auto", currency: "USD", sound: true, reminder: { on: false, time: "21:00" } };
  let store = null;
  let sheet = null;
  let drawer = { open: false, filter: "all" };
  let dataReadyResolve; const dataReady = new Promise((r) => (dataReadyResolve = r));

  /* ---------- layers (sheet, drawer, dialog) and Android's back button ---------- */
  // One history entry ("guard") stands in for all open layers, so Android's back button closes the top one.
  // A back() we trigger ourselves is async; until its popstate arrives we don't push a new guard.
  const layers = [];
  let skipPop = 0, guard = false;
  function ensureGuard() { if (IS_NATIVE && layers.length && !guard && !skipPop) { history.pushState({ lj: 1 }, ""); guard = true; } }
  function pushLayer(name) { layers.push(name); ensureGuard(); }
  function popLayer(name) {
    const i = layers.lastIndexOf(name); if (i < 0) return;
    layers.splice(i, 1);
    if (IS_NATIVE && !layers.length && guard) { guard = false; skipPop++; history.back(); }
  }
  window.addEventListener("popstate", () => {
    if (skipPop) { skipPop--; ensureGuard(); return; }
    guard = false;
    const top = layers.pop();
    if (top === "confirm") answerConfirm(false, true);
    else if (top === "drawer") closeDrawer(true);
    else if (top === "sheet") closeSheet(true);
    ensureGuard();
  });
  function closeTop() {
    const top = layers[layers.length - 1];
    if (top === "confirm") answerConfirm(false);
    else if (top === "sheet") closeSheet();
    else if (top === "drawer") closeDrawer();
  }

  /* ---------- storage ---------- */
  function dbStore(db) {
    return {
      subscribe(col, cb) {
        db.collection(col).onSnapshot(
          (s) => cb(s.docs.map((d) => ({ id: d.id, ...d.data() }))),
          (e) => toast(e && e.code === "revoked" ? "This budget is no longer available here." : "Lost connection to your saved budget. Reload to reconnect.")
        );
      },
      add: (col, data) => db.collection(col).add(data),
      update: (col, id, data) => db.doc(`${col}/${id}`).update(data),
      remove: (col, id) => db.doc(`${col}/${id}`).delete(),
      watchPrefs: (cb) => db.doc("settings/main").onSnapshot((s) => { if (s.exists) cb(s.data()); }, () => {}),
      savePrefs: (d) => db.doc("settings/main").set(d),
    };
  }
  function localStore() {
    const KEY = "budget-jars-v1";
    let data = { buckets: {}, spends: {} };
    try { const raw = localStorage.getItem(KEY); if (raw) data = JSON.parse(raw); } catch {}

  /* ---------- sound: a coin "cha-ching", synthesized so there is no audio file ---------- */
  let audio;
  function chaChing() {
    if (!prefs.sound) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      const t0 = audio.currentTime;
      // "cha": a short bright noise burst, like a register drawer
      const len = Math.floor(audio.sampleRate * 0.07), buf = audio.createBuffer(1, len, audio.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const noise = audio.createBufferSource(); noise.buffer = buf;
      const hp = audio.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 3000;
      const ng = audio.createGain(); ng.gain.value = 0.25;
      noise.connect(hp).connect(ng).connect(audio.destination); noise.start(t0);
      // "ching": two quick bell tones with a ringing tail
      [[0.08, [2093, 3136, 4186]], [0.2, [2637, 3951, 5274]]].forEach(([dt, freqs]) => {
        freqs.forEach((f, k) => {
          const o = audio.createOscillator(), g = audio.createGain();
          o.type = "sine"; o.frequency.value = f;
          const start = t0 + dt, peak = 0.16 / (k + 1);
          g.gain.setValueAtTime(0.0001, start);
          g.gain.exponentialRampToValueAtTime(peak, start + 0.005);
          g.gain.exponentialRampToValueAtTime(0.0001, start + 0.7);
          o.connect(g).connect(audio.destination); o.start(start); o.stop(start + 0.75);
        });
      });
    } catch {}
  }

  /* ---------- reminders (Android app only) ---------- */

    const rm = RM(); if (!rm) return;

    try { await rm.configure({ on: prefs.reminder.on, hour, minute, messages: REMINDERS }); } catch {}
  }
  // Turning reminders on walks through Android's two prompts in one go: notifications, then

  async function enableReminder() {

  /* ---------- the box of jars, seen from the top ---------- */
  function boxView(buckets, by) {
    const n = buckets.length;

    const rows = Math.max(1, Math.ceil(n / cols));

        <div class="sheet-head"><h3>📎 Expenses</h3><button class="x" data-close-drawer aria-label="Close expenses">×</button></div>
        <div class="row-meta">${monthName(state.month)} · <b class="num" style="color:var(--ink)">${money(total)}</b> across ${list.length} spend${list.length === 1 ? "" : "s"}</div>
        <div class="chips">
          <button class="chip" data-dfilter="all" aria-pressed="${drawer.filter === "all"}">All</button>
          ${sortedBuckets().map((b) => `<button class="chip" style="--c:${bucketColor(b)}" data-dfilter="${esc(b.id)}" aria-pressed="${drawer.filter === b.id}">${esc(b.emoji || "🫙")} ${esc(b.name)}</button>`).join("")}
        </div>
      </div>
      <div class="drawer-list">${body || `<div class="empty">No spends here for ${monthName(state.month).split(" ")[0]} yet. Tap <b>Add spend</b> to log one.</div>`}</div>`;
  }

  /* ---------- confirm dialog ---------- */
  let confirmResolve = null;
  function ask({ title, text, yes = "Delete", no = "Keep it", danger = true }) {
    return new Promise((resolve) => {
      confirmResolve = resolve;
      $("confirmRoot").innerHTML = `<div class="scrim confirm-scrim" data-confirm-scrim><div class="dialog" role="alertdialog" aria-modal="true" aria-label="${esc(title)}">
        <h3>${title}</h3><p>${text}</p>
        <div class="actions"><button class="btn" data-ans="0">${esc(no)}</button><button class="btn ${danger ? "danger solid" : "primary"}" data-ans="1">${esc(yes)}</button></div>
      </div></div>`;
      pushLayer("confirm");
      setTimeout(() => { const b = document.querySelector('[data-ans="0"]'); if (b) b.focus(); }, 30);
    });
  }
  function answerConfirm(v, fromPop) {
    if (!confirmResolve) return;
    const r = confirmResolve; confirmResolve = null;
    $("confirmRoot").innerHTML = "";
    if (!fromPop) popLayer("confirm");
    r(v);
  }

  /* ---------- sheets ---------- */
  function openSheet(s) {
    const fresh = !sheet;
    sheet = s;
    if (fresh) pushLayer("sheet");
    renderSheet(true);
    setTimeout(() => { const f = document.querySelector("#sheetRoot [autofocus]"); if (f && window.matchMedia("(pointer:fine)").matches) f.focus(); }, 30);
  }
  function closeSheet(fromPop) {
    if (!sheet) return;
    const was = sheet.kind;
    sheet = null; $("sheetRoot").innerHTML = "";
    if (!fromPop) popLayer("sheet");
    if (was === "whatsnew" || was === "remindAsk") afterOnboarding(was);
  }

  function renderSheet(anim) {
    if (!sheet) return;
    let html = "";
    if (sheet.kind === "spend") {
      const buckets = sortedBuckets();
      const v = evalAmount(sheet.amount || "");
      html = `<div class="sheet-head"><h3>Add spend</h3><button class="x" data-close aria-label="Close">×</button></div>
        <form id="spendForm" style="display:grid;gap:14px" novalidate>
          <label class="f">Amount
            <div class="amount-wrap"><span>${esc(currency.symbol)}</span><input class="t amount num" id="spAmount" inputmode="decimal" autocomplete="off" placeholder="0" style="padding-left:${22 + currency.symbol.length * 20}px" value="${esc(sheet.amount || "")}" autofocus></div>
          </label>
          <div class="ops"><button type="button" data-op="+" aria-label="Plus">+</button><button type="button" data-op="-" aria-label="Minus">−</button><span class="calc num" id="amtCalc">${hasOps(sheet.amount || "") && isFinite(v) ? "= " + esc(money(v)) : ""}</span></div>
          <div class="f">Which jar?
            <div class="chips">${buckets.map((b) => `<button type="button" class="chip" style="--c:${bucketColor(b)}" data-pick="${esc(b.id)}" aria-pressed="${sheet.bucketId === b.id}">${esc(b.emoji || "🫙")} ${esc(b.name)}</button>`).join("")}</div>
          </div>
          <div class="two">
            <label class="f">What was it? <input class="t" id="spNote" placeholder="Trader Joe's" maxlength="80" value="${esc(sheet.note || "")}"></label>
            <label class="f">Date <input class="t" id="spDate" type="date" value="${esc(sheet.date || todayStr())}"></label>
          </div>
          ${sheet.error ? `<div class="err">${esc(sheet.error)}</div>` : ""}
          <div class="actions"><button class="btn primary" type="submit">Add spend</button></div>
        </form>`;
    } else if (sheet.kind === "bucket") {
      const b = sheet.draft, buckets = sortedBuckets(), idx = sheet.id ? buckets.findIndex((x) => x.id === sheet.id) : -1;
      html = `<div class="sheet-head"><h3>${sheet.id ? "Edit jar" : "New jar"}</h3><button class="x" data-close aria-label="Close">×</button></div>
        <form id="bucketForm" style="display:grid;gap:16px" novalidate>
          ${sheet.id ? "" : `<div class="chips">${PRESETS.filter(([n]) => !state.buckets.some((x) => x.name.toLowerCase() === n.toLowerCase())).map(([n, e]) => `<button type="button" class="chip" data-preset="${esc(n)}|${e}">${e} ${esc(n)}</button>`).join("")}</div>`}
          <div class="two">
            <label class="f">Name <input class="t" id="bkName" maxlength="40" placeholder="Groceries" value="${esc(b.name)}" autofocus></label>
            <label class="f">Monthly limit <div class="amount-wrap"><span style="font-size:1.1rem;left:14px">${esc(currency.symbol)}</span><input class="t num" id="bkLimit" inputmode="decimal" placeholder="600" style="padding-left:${18 + currency.symbol.length * 11}px" value="${esc(b.limit)}"></div></label>
          </div>
          <div class="f">Icon
            <div class="emojis">${EMOJIS.map((e) => `<button type="button" data-emoji="${e}" aria-pressed="${b.emoji === e}" aria-label="${e}">${e}</button>`).join("")}</div>
          </div>
          <div class="f">Color
            <div class="swatches">${Array.from({ length: COLORS }, (_, i) => `<button type="button" data-color="${i}" style="background:var(--j${i})" aria-pressed="${b.color === i}" aria-label="Color ${i + 1}"></button>`).join("")}</div>
          </div>
          <div class="f">What's inside?
            <div class="chips">${[["surprise", "Surprise me", "🎲"], ...FILLS].map(([id, label, e]) => `<button type="button" class="chip" data-fill="${id}" aria-pressed="${(b.fill || "surprise") === id}">${e} ${label}</button>`).join("")}</div>
          </div>
          ${sheet.id && buckets.length > 1 ? `<div class="f">Position
            <div class="actions"><button type="button" class="btn" data-move="-1" ${idx <= 0 ? "disabled" : ""}>← Earlier</button><button type="button" class="btn" data-move="1" ${idx >= buckets.length - 1 ? "disabled" : ""}>Later →</button></div>
          </div>` : ""}
          ${sheet.error ? `<div class="err">${esc(sheet.error)}</div>` : ""}
          <div class="actions"><button class="btn primary" type="submit">${sheet.id ? "Save jar" : "Create jar"}</button></div>
        </form>`;
    } else if (sheet.kind === "settings") {
      const cur = currentTheme(), ln = !!RM();
      html = `<div class="sheet-head"><h3>Settings</h3><button class="x" data-close aria-label="Close">×</button></div>
        <div class="f">Theme
          <div class="themes">${THEMES.map((th) => `<button class="theme-opt" data-pick-theme="${th.id}" aria-pressed="${cur === th.id}">
            <span class="swatch" aria-hidden="true">${th.sw.map((c) => `<i style="background:${c}"></i>`).join("")}</span>
            <span><b>${th.name}</b><span>${th.desc}</span></span>
          </button>`).join("")}</div>
        </div>
        <label class="f">Currency
          <select class="t" id="curSel">${CURRENCIES.map(([code, name]) => `<option value="${code}" ${code === currency.code ? "selected" : ""}>${code} · ${name}</option>`).join("")}</select>
          <span class="row-meta" style="font-weight:400">Example: ${esc(money(1234.5))}. Changing currency relabels your amounts; it doesn't convert them.</span>
        </label>
        <div class="set-row"><span>🔔 Cha-ching sound<small>Plays when you add a spend</small></span><span class="switch"><input type="checkbox" id="soundToggle" aria-label="Cha-ching sound" ${prefs.sound ? "checked" : ""}><i></i></span></div>
        ${ln ? `<div class="set-row"><span>🌙 Daily reminder<small>A gentle nudge to log your spends</small></span><span class="switch"><input type="checkbox" id="remToggle" aria-label="Daily reminder" ${prefs.reminder.on ? "checked" : ""}><i></i></span></div>
        ${prefs.reminder.on ? `<div class="set-row"><span>Remind me at</span><input type="time" id="remTime" value="${esc(prefs.reminder.time)}"></div>
        <button class="btn" data-test-nudge style="text-align:left">🔔 Send a test nudge in 10 seconds</button>` : ""}` : ""}
        <button class="btn" data-feature style="text-align:left">💌 Request a feature</button>
        <div class="links"><button class="link-btn" data-replay-tour>Replay the tour</button><button class="link-btn" data-whatsnew>What's new</button></div>
        <div class="version">Little Jars ${APP_VERSION}</div>`;
    } else if (sheet.kind === "feature") {
      html = `<div class="sheet-head"><h3>💌 Request a feature</h3><button class="x" data-close aria-label="Close">×</button></div>
        <form id="featureForm" style="display:grid;gap:14px" novalidate>
          <label class="f">What would make Little Jars better?<textarea class="t" id="ftIdea" maxlength="1500" placeholder="I wish my jars could…" autofocus>${esc(sheet.idea || "")}</textarea></label>
          <label class="f">Your name (optional) <input class="t" id="ftName" maxlength="60" value="${esc(sheet.name || "")}"></label>
          ${sheet.error ? `<div class="err">${esc(sheet.error)}</div>` : ""}
          <div class="actions"><button class="btn primary" type="submit">Send to the Little Jars team</button></div>
          <div class="row-meta">This opens your email app with your note ready to send to ${SUPPORT_EMAIL}.</div>
          ${sheet.tried ? `<div class="f">Email app didn't open? Send it to:<div class="copy-box"><code>${SUPPORT_EMAIL}</code><button type="button" class="btn" data-copy-feature>Copy note</button></div></div>` : ""}
        </form>`;
    } else if (sheet.kind === "whatsnew") {
      const items = [
        ["🫙", "We're <b>Little Jars</b> now! Same jars, cuter name."],
        ["🍬", "Jars got snacks: liquid, candy, chocolate kisses, cash or coins. Edit a jar to pick, or let us surprise you."],
        ["📦", "Peek into the box from the top. Every lid wears its name tag."],
        ["📎", "Expenses moved into a drawer. Tug the paper clip on the right."],
        ["🔔", "Cha-ching! Spends now jingle. (Shh, you can mute it in Settings.)"],
        ["🧮", "Math mode: type 12+10 and we'll do the homework."],
        ["🫳", "Hold a jar and drag it to put your favorites first."],
        ...(RM() ? [["🌙", "Gentle evening nudges to log your day. We promise to be nice."]] : []),
        ["🙅", "Oops-proofing: we now double-check before deleting anything, and stop you from making two jars with the same name."],
        ["💌", "Got an idea? Settings → Request a feature. We read every single one."],
      ];
      html = `<div class="sheet-head"><h3>Psst… we've been busy ✨</h3><button class="x" data-close aria-label="Close">×</button></div>
        <ul class="news">${items.map(([e, t]) => `<li><span aria-hidden="true">${e}</span><div>${t}</div></li>`).join("")}</ul>
        <div class="actions"><button class="btn" data-replay-tour>Show me around</button><button class="btn primary" data-close>Let's go!</button></div>`;
    } else if (sheet.kind === "remindAsk") {
      html = `<div class="sheet-head"><h3>🌙 Want a gentle nudge?</h3><button class="x" data-close aria-label="Close">×</button></div>
        <p style="margin:0">We can send one friendly reminder at <b>9 PM</b> to log your spends. No nagging, promise. You can change the time or turn it off in Settings.</p>
        <p class="row-meta" style="margin:0">Android will ask to allow <b>notifications</b> and then <b>Alarms &amp; reminders</b>. Switch both on so your nudge shows up right on time.</p>
        <div class="actions"><button class="btn" data-remind-no>Not now</button><button class="btn primary" data-remind-yes>Yes please</button></div>`;
    } else if (sheet.kind === "detail") {
      const b = state.buckets.find((x) => x.id === sheet.id);
      if (!b) { closeSheet(); return; }
      const { ms, by } = totals();
      const sp = by[b.id] || 0, lim = Number(b.limit) || 0, lf = lim - sp;
      const list = ms.filter((s) => s.bucketId === b.id).sort((a, c) => (c.date || "").localeCompare(a.date || "") || (c.createdAt || 0) - (a.createdAt || 0));
      const all = state.spends.filter((s) => s.bucketId === b.id).length;
      html = `<div class="sheet-head"><h3>${esc(b.emoji || "🫙")} ${esc(b.name)}</h3><button class="x" data-close aria-label="Close">×</button></div>
        <div class="detail-top" style="--c:${bucketColor(b)}">
          <div class="eyebrow">${monthName(state.month)}</div>
          <div class="big num ${lf < 0 ? "over" : ""}" style="font-size:2.4rem;${lf < 0 ? "color:var(--danger)" : ""}">${lf < 0 ? money(-lf) + " over" : money(lf) + " left"}</div>
          <div class="bar"><i style="width:${lim > 0 ? Math.min(100, sp / lim * 100) : 0}%"></i></div>
          <div class="pace num" style="text-align:left">${money(sp)} spent of ${money(lim)}</div>
        </div>
        <div class="detail-list">${list.length ? list.map((s) => spendRow(s, b)).join("") : `<div class="empty">Nothing spent from this jar in ${monthName(state.month).split(" ")[0]}.</div>`}</div>
        ${state.readOnly ? "" : sheet.confirmDelete ? `<div class="confirm"><div>Delete <b>${esc(b.name)}</b>${all ? ` and its ${all} logged spend${all === 1 ? "" : "s"} (all months)` : ""}? This can't be undone.</div>
          <div class="actions"><button class="btn danger solid" data-delete-bucket-yes>Delete jar</button><button class="btn" data-delete-bucket-no>Keep it</button></div></div>`
        : `<div class="actions"><button class="btn primary" data-spend-in="${esc(b.id)}">Add spend here</button><button class="btn" data-edit="${esc(b.id)}">Edit</button><button class="btn danger" data-delete-bucket>Delete</button></div>`}`;
    }
    const active = document.activeElement && document.activeElement.id;
    const prevScroll = document.querySelector("#sheetRoot .sheet")?.scrollTop || 0;
    $("sheetRoot").innerHTML = `<div class="scrim" data-scrim><div class="sheet ${anim ? "anim" : ""}" role="dialog" aria-modal="true">${html}</div></div>`;
    const sh = document.querySelector("#sheetRoot .sheet"); if (sh && !anim) sh.scrollTop = prevScroll;
    if (active && $(active)) $(active).focus();
  }

  // Keep typed values in the sheet state so re-renders don't lose them.
  document.addEventListener("input", (e) => {
    if (!sheet) return;
    const t = e.target;
    if (t.id === "spAmount" || t.id === "bkLimit") {
      const c = cleanAmount(t.value);
      if (c !== t.value) { const pos = Math.max(0, (t.selectionStart || 0) - (t.value.length - c.length)); t.value = c; try { t.setSelectionRange(pos, pos); } catch {} }
      if (t.id === "spAmount") {
        sheet.amount = c;
        const v = evalAmount(c), calc = $("amtCalc");
        if (calc) calc.textContent = hasOps(c) && isFinite(v) ? "= " + money(v) : "";
      } else sheet.draft.limit = c;
    }
    if (t.id === "spNote") sheet.note = t.value;
    if (t.id === "spDate") sheet.date = t.value;
    if (t.id === "bkName") sheet.draft.name = t.value;
    if (t.id === "ftIdea") sheet.idea = t.value;
    if (t.id === "ftName") sheet.name = t.value;
  });
  // + and − buttons insert into the amount without closing the phone keyboard.
  document.addEventListener("pointerdown", (e) => {
    const b = e.target.closest("[data-op]"); if (!b) return;
    e.preventDefault();
    const inp = $("spAmount"); if (!inp) return;
    const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? inp.value.length;
    inp.value = inp.value.slice(0, s) + b.dataset.op + inp.value.slice(en);
    inp.focus(); try { inp.setSelectionRange(s + 1, s + 1); } catch {}
    inp.dispatchEvent(new Event("input", { bubbles: true }));
  });

  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "curSel") { setCurrencyCode(t.value); prefs.currency = currency.code; savePrefs(); render(); renderSheet(); }
    if (t.id === "soundToggle") { prefs.sound = t.checked; savePrefs(); if (prefs.sound) chaChing(); }
    if (t.id === "remToggle") { if (t.checked) enableReminder(); else { prefs.reminder.on = false; savePrefs(); syncReminder(); } renderSheet(); }
    if (t.id === "remTime" && t.value) { prefs.reminder.time = t.value; savePrefs(); syncReminder(); toast(`We'll nudge you at ${fmtTime(t.value)}`); }
  });
  const fmtTime = (hm) => { const [h, m] = hm.split(":").map(Number); return new Date(2000, 0, 1, h, m).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); };

  let suppressClickUntil = 0;
  document.addEventListener("click", async (e) => {
    if (Date.now() < suppressClickUntil) { e.preventDefault(); return; }
    const t = e.target.closest("button, [data-open], [data-scrim], [data-confirm-scrim], #drawerScrim");
    if (!t) return;
    if (t.matches("[data-confirm-scrim]") && e.target === t) return answerConfirm(false);
    if (t.dataset.ans) return answerConfirm(t.dataset.ans === "1");
    if (t.matches("[data-scrim]") && e.target === t) return closeSheet();
    if (t.id === "drawerScrim" || t.matches("[data-close-drawer]")) return closeDrawer();
    if (t.matches("[data-close]")) return closeSheet();
    if (t.id === "prevMonth") { state.month = shiftMonth(state.month, -1); return render(); }
    if (t.id === "nextMonth") { state.month = shiftMonth(state.month, 1); return render(); }
    if (t.id === "fab") return openAddSpend();
    if (t.id === "clipTab") return openDrawer();
    if (t.id === "settingsBtn") return openSheet({ kind: "settings" });
    if (t.id === "newBucketTop" || t.matches("[data-new-bucket]")) return openBucket();
    if (t.dataset.dfilter) { drawer.filter = t.dataset.dfilter; return renderDrawer(); }
    if (t.dataset.open) return openSheet({ kind: "detail", id: t.dataset.open });
    if (t.dataset.spendIn) return openAddSpend(t.dataset.spendIn);
    if (t.dataset.edit) return openBucket(t.dataset.edit);
    if (t.dataset.pick) { sheet.bucketId = t.dataset.pick; sheet.error = ""; return renderSheet(); }
    if (t.dataset.emoji) { sheet.draft.emoji = t.dataset.emoji; return renderSheet(); }
    if (t.dataset.color) { sheet.draft.color = Number(t.dataset.color); return renderSheet(); }
    if (t.dataset.fill) { sheet.draft.fill = t.dataset.fill; return renderSheet(); }
    if (t.dataset.preset) { const [n, em] = t.dataset.preset.split("|"); sheet.draft.name = n; sheet.draft.emoji = em; sheet.error = ""; return renderSheet(); }
    if (t.dataset.move) { await moveBucket(sheet.id, Number(t.dataset.move)); return renderSheet(); }
    if (t.dataset.pickTheme) { setTheme(t.dataset.pickTheme); savePrefs(); return renderSheet(); }
    if (t.matches("[data-feature]")) return openSheet({ kind: "feature" });
    if (t.matches("[data-test-nudge]")) return testNudge();
    if (t.matches("[data-copy-feature]")) return copyText(featureBody(), "Note copied. Paste it into an email to us.");
    if (t.matches("[data-replay-tour]")) { tourActive = true; closeSheet(); return startTour(); }
    if (t.matches("[data-whatsnew]")) return openSheet({ kind: "whatsnew" });
    if (t.matches("[data-remind-yes]")) {
      lsSet("lj-reminder-asked", "1"); prefs.reminder.time = prefs.reminder.time || "21:00"; closeSheet();
      return enableReminder();
    }
    if (t.matches("[data-remind-no]")) { lsSet("lj-reminder-asked", "1"); prefs.reminder.on = false; savePrefs(); syncReminder(); return closeSheet(); }
    if (t.matches("[data-delete-bucket]")) { sheet.confirmDelete = true; return renderSheet(); }
    if (t.matches("[data-delete-bucket-no]")) { sheet.confirmDelete = false; return renderSheet(); }
    if (t.matches("[data-delete-bucket-yes]")) {
      const id = sheet.id, b = state.buckets.find((x) => x.id === id);
      closeSheet();
      const spends = state.spends.filter((s) => s.bucketId === id);
      await write(async () => { for (const s of spends) await store.remove("spends", s.id); await store.remove("buckets", id); }, `Deleted ${b ? b.name : "jar"}`);
      return;
    }
    if (t.dataset.delSpend) {
      const s = state.spends.find((x) => x.id === t.dataset.delSpend);
      if (!s) return;
      const b = state.buckets.find((x) => x.id === s.bucketId);
      const ok = await ask({ title: "Delete this spend?", text: `<b>${esc(money(Number(s.amount) || 0))}</b>${s.note ? ` · ${esc(s.note)}` : ""} from <b>${esc(b ? b.name : "this jar")}</b> on ${shortDate(s.date)}. This can't be undone.` });
      if (ok) await write(() => store.remove("spends", s.id), `Deleted ${money(Number(s.amount) || 0)}`);
    }
  });

  document.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (e.target.id === "spendForm") {
      const amt = evalAmount(sheet.amount || "");
      if (!(amt > 0)) { sheet.error = "Enter an amount above 0."; return renderSheet(); }
      if (amt > MAX_AMOUNT) { sheet.error = `That's more than ${money(MAX_AMOUNT)}. Try a smaller amount.`; return renderSheet(); }
      if (!sheet.bucketId) { sheet.error = "Pick a jar for this spend."; return renderSheet(); }
      const b = state.buckets.find((x) => x.id === sheet.bucketId);
      const data = { bucketId: sheet.bucketId, amount: amt, note: (sheet.note || "").trim(), date: sheet.date || todayStr(), createdAt: Date.now() };
      closeSheet();
      if (data.date.slice(0, 7) !== state.month) state.month = data.date.slice(0, 7);
      chaChing();
      await write(() => store.add("spends", data), `Added ${money(amt)} to ${b ? b.name : "jar"}`);
    }
    if (e.target.id === "bucketForm") {
      const d = sheet.draft, name = (d.name || "").trim(), lim = evalAmount(d.limit || "");
      if (!name) { sheet.error = "Give this jar a name."; return renderSheet(); }
      const dup = state.buckets.find((x) => x.id !== sheet.id && x.name.trim().toLowerCase() === name.toLowerCase());
      if (dup) { await ask({ title: "That jar already exists 🫙", text: `You already have a <b>${esc(dup.emoji || "🫙")} ${esc(dup.name)}</b> jar. Try a different name, or add spends to that one.`, yes: "Got it", no: "Cancel", danger: false }); return; }
      if (!(lim >= 0)) { sheet.error = "Enter a monthly limit, like 300."; return renderSheet(); }
      if (lim > MAX_AMOUNT) { sheet.error = `That's more than ${money(MAX_AMOUNT)}. Try a smaller limit.`; return renderSheet(); }
      const data = { name, limit: lim, emoji: d.emoji || "🫙", color: d.color ?? 0, fill: d.fill || "surprise" };
      const id = sheet.id;
      closeSheet();
      if (id) await write(() => store.update("buckets", id, data), `Saved ${name}`);
      else await write(() => store.add("buckets", { ...data, order: state.buckets.reduce((m, b) => Math.max(m, b.order ?? 0), 0) + 1, createdAt: Date.now() }), `Created ${name}`);
    }
    if (e.target.id === "featureForm") {
      if (!(sheet.idea || "").trim()) { sheet.error = "Tell us your idea first."; return renderSheet(); }
      const url = `mailto:${SUPPORT_EMAIL}?subject=${encodeURIComponent("Little Jars feature request")}&body=${encodeURIComponent(featureBody())}`;
      sheet.tried = true; sheet.error = ""; renderSheet();
      try { window.location.href = url; } catch {}
      toast("Opening your email app…");
    }
  });
  function featureBody() {
    return `${(sheet && sheet.idea || "").trim()}\n\n— ${(sheet && sheet.name || "").trim() || "A Little Jars user"}\nLittle Jars ${APP_VERSION}${IS_NATIVE ? " (Android)" : IN_CLAUDE ? " (claude.ai)" : " (web)"}`;
  }
  async function copyText(text, msg) {
    try { await navigator.clipboard.writeText(text); toast(msg); } catch { toast("Couldn't copy. Long-press the email address to copy it."); }
  }

  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (tourActive) endTour(); else closeTop(); } });

  function openAddSpend(bucketId) {
    if (!state.buckets.length) return openBucket();
    openSheet({ kind: "spend", bucketId: bucketId || (state.buckets.length === 1 ? state.buckets[0].id : ""), date: state.month === curMonth() ? todayStr() : `${state.month}-01` });
  }
  function openBucket(id) {
    const b = id && state.buckets.find((x) => x.id === id);
    const used = new Set(state.buckets.map((x) => x.color));
    let free = 0; while (used.has(free) && free < COLORS - 1) free++;
    openSheet({ kind: "bucket", id: id || null, draft: b ? { name: b.name, limit: String(b.limit), emoji: b.emoji, color: b.color ?? 0, fill: b.fill || "surprise" } : { name: "", limit: "", emoji: "🛒", color: free, fill: "surprise" } });
  }

  /* ---------- reordering jars: long-press and drag, or the Earlier/Later buttons ---------- */
  async function saveOrder(ids) {
    const changed = ids.map((id, i) => [id, i + 1]).filter(([id, o]) => (state.buckets.find((b) => b.id === id) || {}).order !== o);
    if (!changed.length) return;
    await write(async () => { for (const [id, o] of changed) await store.update("buckets", id, { order: o }); });
  }
  async function moveBucket(id, delta) {
    const ids = sortedBuckets().map((b) => b.id), i = ids.indexOf(id), j = i + delta;
    if (i < 0 || j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    await saveOrder(ids);
  }
  let drag = null;
  function pressStart(x, y, target) {
    if (state.readOnly || drag) return;
    const jar = target.closest && target.closest(".jar[data-id]"); if (!jar) return;
    drag = { jar, x0: x, y0: y, x, y, active: false, timer: setTimeout(() => activateDrag(), 420) };
  }
  function activateDrag() {
    if (!drag) return;
    drag.active = true;
    try { navigator.vibrate && navigator.vibrate(15); } catch {}
    const g = drag.jar.cloneNode(true); g.classList.add("drag-ghost"); g.style.width = drag.jar.offsetWidth + "px";
    g.style.left = drag.x + "px"; g.style.top = drag.y + "px"; document.body.appendChild(g); drag.ghost = g;
    drag.jar.classList.add("drag-src");
  }
  function pressMove(x, y, ev) {
    if (!drag) return;
    drag.x = x; drag.y = y;
    if (!drag.active) { if (Math.hypot(x - drag.x0, y - drag.y0) > 10) cancelDrag(); return; }
    if (ev && ev.cancelable) ev.preventDefault();
    drag.ghost.style.left = x + "px"; drag.ghost.style.top = y + "px";
    const over = document.elementFromPoint(x, y), tj = over && over.closest(".jar[data-id]");
    if (tj && tj !== drag.jar) {
      const grid = $("jars"), kids = [...grid.children];
      grid.insertBefore(drag.jar, kids.indexOf(tj) > kids.indexOf(drag.jar) ? tj.nextSibling : tj);
    }
    if (y < 70) window.scrollBy(0, -12); else if (y > innerHeight - 70) window.scrollBy(0, 12);
  }
  function cancelDrag() { if (!drag) return; clearTimeout(drag.timer); drag.ghost && drag.ghost.remove(); drag.jar.classList.remove("drag-src"); drag = null; }
  async function pressEnd() {
    if (!drag) return;
    const was = drag.active;
    clearTimeout(drag.timer);
    if (was) {
      suppressClickUntil = Date.now() + 400;
      drag.ghost.remove(); drag.jar.classList.remove("drag-src");
      const ids = [...$("jars").querySelectorAll(".jar[data-id]")].map((el) => el.dataset.id);
      drag = null;
      await saveOrder(ids);
      render();
    } else drag = null;
  }
  const jarsEl = $("jars");
  jarsEl.addEventListener("touchstart", (e) => { const t = e.touches[0]; pressStart(t.clientX, t.clientY, e.target); }, { passive: true });
  document.addEventListener("touchmove", (e) => { if (drag) { const t = e.touches[0]; pressMove(t.clientX, t.clientY, e); } }, { passive: false });
  document.addEventListener("touchend", pressEnd); document.addEventListener("touchcancel", () => { if (drag && !drag.active) cancelDrag(); else pressEnd(); });
  jarsEl.addEventListener("mousedown", (e) => { if (e.button === 0) pressStart(e.clientX, e.clientY, e.target); });
  document.addEventListener("mousemove", (e) => { if (drag) pressMove(e.clientX, e.clientY, e); });
  document.addEventListener("mouseup", pressEnd);
  jarsEl.addEventListener("contextmenu", (e) => { if (e.target.closest(".jar")) e.preventDefault(); });

  /* ---------- toasts ---------- */
  let toastTimer;
  function toast(msg) {
    const el = $("toast"); el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 2600);
  }

  /* ---------- first-run tour ---------- */
  let tourStep = 0, tourSteps = [], tourActive = false;
  function startTour() {
    tourSteps = [
      { sel: ".jarbox", title: "Your box of jars 📦", text: "Every jar you make sits in this box. The label shows what's left this month across all of them." },
      state.buckets.length
        ? { sel: ".jar[data-id]", title: "Your jars 🫙", text: "Each jar has a monthly limit and drains as you spend. Tap one for details. Hold and drag to move it." }
        : { sel: ".jar.add", title: "Make your first jar 🫙", text: "Start here: create a jar like Groceries and give it a monthly limit." },
      { sel: "#fab", title: "Log a spend ✍️", text: "Tap here whenever you spend. Tip: type 12+10 and we'll add it up for you." },
      { sel: "#clipTab", title: "Your expenses 📎", text: "Tug the paper clip to see everything you've spent this month." },
      { sel: "#settingsBtn", title: "Make it yours ⚙️", text: "Themes, currency, sounds, reminders and feature requests live here." },
    ];
    tourStep = 0; tourActive = true; lsSet("lj-tour-done", "1"); lsSet("lj-seen-version", APP_VERSION);
    showTourStep();
  }
  function showTourStep() {
    const step = tourSteps[tourStep];
    if (!step) return endTour();
    const el = document.querySelector(step.sel);
    if (!el || el.hidden) { tourStep++; return showTourStep(); }
    if (getComputedStyle(el).position !== "fixed") el.scrollIntoView({ block: "center" });
    requestAnimationFrame(() => setTimeout(() => {
      if (!tourActive) return;
      const r = el.getBoundingClientRect(), p = 8;
      const below = innerHeight - r.bottom > 230 || r.top < 230;
      const bw = Math.min(320, innerWidth - 32), cx = r.left + r.width / 2;
      const left = Math.max(16, Math.min(innerWidth - bw - 16, cx - bw / 2));
      const last = tourStep === tourSteps.length - 1;
      $("tourRoot").innerHTML = `<div class="tour" role="dialog" aria-modal="true" aria-label="Quick tour">
        <div class="tour-spot" style="left:${r.left - p}px;top:${r.top - p}px;width:${r.width + p * 2}px;height:${r.height + p * 2}px"></div>
        <div class="tour-arrow ${below ? "up" : "down"}" style="left:${cx}px;top:${below ? r.bottom + p + 6 : r.top - p - 50}px"><svg viewBox="0 0 24 24" width="44" height="44"><path d="M12 22 L3 11 H9 V2 H15 V11 H21 Z" fill="currentColor" stroke="#7A5A00" stroke-width="1"/></svg></div>
        <div class="tour-bubble" style="left:${left}px;${below ? `top:${r.bottom + p + 58}px` : `bottom:${innerHeight - r.top + p + 58}px`}">
          <b>${step.title}</b><p>${step.text}</p>
          <div class="actions"><span class="tour-step">${tourStep + 1} of ${tourSteps.length}</span>${last ? "" : `<button class="btn" data-tour="skip">Skip</button>`}<button class="btn primary" data-tour="next" style="flex:none">${last ? "Got it!" : "Next"}</button></div>
        </div></div>`;
      const nb = document.querySelector('[data-tour="next"]'); if (nb) nb.focus();
    }, 260));
  }
  function endTour() { tourActive = false; $("tourRoot").innerHTML = ""; window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); afterOnboarding("tour"); }
  $("tourRoot").addEventListener("click", (e) => {
    const b = e.target.closest("[data-tour]"); if (!b) return;
    if (b.dataset.tour === "skip") return endTour();
    tourStep++; showTourStep();
  });
  window.addEventListener("resize", () => { if (tourActive) showTourStep(); });

  /* ---------- onboarding flow: intro → tour (new) or what's new (update) → reminder offer ---------- */
  function afterOnboarding(from) {
    if (RM() && !lsGet("lj-reminder-asked") && from !== "remindAsk" && !sheet && !tourActive) {
      setTimeout(() => { if (!sheet && !tourActive) openSheet({ kind: "remindAsk" }); }, 350);
    }
  }
  async function runOnboarding() {
    await dataReady;
    if (sheet || tourActive) return;
    const isNew = !lsGet("lj-tour-done") && !state.buckets.length && !state.spends.length;
    if (isNew) return startTour();
    if (lsGet("lj-seen-version") !== APP_VERSION) { lsSet("lj-seen-version", APP_VERSION); lsSet("lj-tour-done", "1"); return openSheet({ kind: "whatsnew" }); }
    afterOnboarding("start");
  }
  function playIntro() {
    const el = $("intro");
    return new Promise((resolve) => {
      let done = false;
      const finish = () => { if (done) return; done = true; el.classList.add("out"); setTimeout(() => { el.remove(); resolve(); }, 350); };
      el.addEventListener("click", finish);
      setTimeout(finish, reduceMotion ? 500 : 1900);
    });
  }

  /* ---------- boot ---------- */
  async function boot() {
    loadLocalPrefs();
    setTheme(prefs.theme);
    if ("serviceWorker" in navigator && location.protocol === "https:" && !IS_NATIVE && document.querySelector('link[rel="manifest"]')) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
    if (!IS_NATIVE && !document.querySelector('link[rel="manifest"]')) { const f = $("foot"); if (f) f.hidden = true; }
    render();
    const introDone = playIntro();
    let db = null;
    if (IN_CLAUDE) { try { db = await window.claude.use("db"); } catch {} }
    if (db) store = dbStore(db);
    else {
      store = localStore();
      if (IN_CLAUDE) { const n = $("notice"); n.hidden = false; n.textContent = "Saving on this device only. Open this page signed in to claude.ai to keep your budget synced."; }
    }
    if (IN_CLAUDE && db) {
      try { const user = await window.claude.use("user"); if (user && user.can && (await user.can("data.write")) === false) state.readOnly = true; } catch {}
    }
    const markLoaded = () => { if (state.loaded.buckets && state.loaded.spends) dataReadyResolve(); };
    store.subscribe("buckets", (docs) => { state.buckets = docs; state.loaded.buckets = true; render(); markLoaded(); });
    store.subscribe("spends", (docs) => { state.spends = docs; state.loaded.spends = true; render(); markLoaded(); });
    if (store.watchPrefs) store.watchPrefs((p) => {
      if (p.theme && p.theme !== currentTheme()) { setTheme(p.theme); lsSet("budget-jars-theme", p.theme); }
      if (p.currency && p.currency !== currency.code) { setCurrencyCode(p.currency); prefs.currency = currency.code; lsSet("budget-jars-currency", currency.code); }
      if (typeof p.sound === "boolean") { prefs.sound = p.sound; lsSet("lj-sound", p.sound ? "on" : "off"); }
      render(); if (sheet && sheet.kind === "settings") renderSheet();
    });
    await introDone;
    await runOnboarding();
    dataReady.then(() => syncReminder());
    handleReminderTap();
  }
  boot();
})();
</script>
</body>
</html>
